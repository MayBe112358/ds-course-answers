<script type="text/plain" id="c1-1">
#include <stdio.h>
#define MAXN 100

typedef struct {
    int id;                 /* 学号 */
    char name[20];
    int score[3];           /* 语文、数学、英语 */
    int total;
} Student;

typedef struct {
    Student data[MAXN];
    int length;
} SqList;

void Input(SqList *L) {
    int i;
    printf("请输入学生人数：");
    scanf("%d", &L->length);
    for (i = 0; i < L->length; i++) {
        Student *s = &L->data[i];
        printf("请输入第 %d 位同学的学号 姓名 语文 数学 英语：", i + 1);
        scanf("%d %19s %d %d %d", &s->id, s->name, &s->score[0], &s->score[1], &s->score[2]);
        s->total = s->score[0] + s->score[1] + s->score[2];
    }
}

/* 冒泡排序，按总分从高到低；只在严格小于时交换，总分相同的保持录入顺序 */
void SortByTotal(SqList *L) {
    int i, j, swapped;
    Student t;
    for (i = 0; i < L->length - 1; i++) {
        swapped = 0;
        for (j = 0; j < L->length - 1 - i; j++) {
            if (L->data[j].total < L->data[j + 1].total) {
                t = L->data[j];
                L->data[j] = L->data[j + 1];
                L->data[j + 1] = t;
                swapped = 1;
            }
        }
        if (!swapped)           /* 一趟下来没有交换，已经有序 */
            break;
    }
}

void Output(SqList *L) {
    int i, rank = 0;
    printf("名次\t学号\t姓名\t语文\t数学\t英语\t总分\n");
    for (i = 0; i < L->length; i++) {
        Student *s = &L->data[i];
        if (i == 0 || s->total != L->data[i - 1].total)
            rank = i + 1;       /* 总分相同名次并列 */
        printf("%d\t%d\t%s\t%d\t%d\t%d\t%d\n", rank, s->id, s->name,
               s->score[0], s->score[1], s->score[2], s->total);
    }
}

int main(void) {
    SqList L;
    Input(&L);
    SortByTotal(&L);
    Output(&L);
    return 0;
}
</script>
<script type="text/plain" id="c1-2">
#include <stdio.h>
#include <stdlib.h>

typedef struct Node {
    int id;
    char name[20];
    int score[3];
    int total;
    struct Node *next;
} Node;

/* 插到所有总分不低于它的结点之后，链表始终按总分从高到低有序 */
void InsertSorted(Node *head, Node *s) {
    Node *pre = head;
    while (pre->next != NULL && pre->next->total >= s->total)
        pre = pre->next;
    s->next = pre->next;
    pre->next = s;
}

int main(void) {
    Node *head = (Node *)malloc(sizeof(Node)), *s, *p;
    int n, i, rank = 0, prev = -1;
    head->next = NULL;
    printf("请输入学生人数：");
    scanf("%d", &n);
    for (i = 1; i <= n; i++) {
        s = (Node *)malloc(sizeof(Node));
        printf("请输入第 %d 位同学的学号 姓名 语文 数学 英语：", i);
        scanf("%d %19s %d %d %d", &s->id, s->name, &s->score[0], &s->score[1], &s->score[2]);
        s->total = s->score[0] + s->score[1] + s->score[2];
        InsertSorted(head, s);          /* 边录入边排序 */
    }

    printf("名次\t学号\t姓名\t语文\t数学\t英语\t总分\n");
    for (p = head->next, i = 1; p != NULL; p = p->next, i++) {
        if (p->total != prev)
            rank = i;                   /* 总分相同名次并列 */
        prev = p->total;
        printf("%d\t%d\t%s\t%d\t%d\t%d\t%d\n", rank, p->id, p->name,
               p->score[0], p->score[1], p->score[2], p->total);
    }

    while (head != NULL) {
        p = head;
        head = head->next;
        free(p);
    }
    return 0;
}
</script>
<script type="text/plain" id="c2-1">
#include <stdio.h>
#include <stdlib.h>

typedef struct {
    long num;               /* 分子 */
    long den;               /* 分母，始终为正 */
} Rational;

long Gcd(long a, long b) {
    long r;
    if (a < 0) a = -a;
    if (b < 0) b = -b;
    while (b != 0) {
        r = a % b;
        a = b;
        b = r;
    }
    return a;
}

/* 1）由分子和分母生成有理数：符号放在分子上，并约成最简分数 */
Rational Make(long num, long den) {
    Rational r;
    long g;
    if (den == 0) {
        printf("分母不能为 0\n");
        exit(1);
    }
    if (den < 0) {
        num = -num;
        den = -den;
    }
    g = Gcd(num, den);              /* num 为 0 时 g 等于 den，结果是 0/1 */
    r.num = num / g;
    r.den = den / g;
    return r;
}

/* 2）3）4）和、差、积：直接交叉相乘，交给 Make 约分 */
Rational Add(Rational a, Rational b) { return Make(a.num * b.den + b.num * a.den, a.den * b.den); }
Rational Sub(Rational a, Rational b) { return Make(a.num * b.den - b.num * a.den, a.den * b.den); }
Rational Mul(Rational a, Rational b) { return Make(a.num * b.num, a.den * b.den); }

/* 5）6）分子、分母 */
long Numerator(Rational r) { return r.num; }
long Denominator(Rational r) { return r.den; }

void Print(const char *label, Rational r) {
    if (r.den == 1)
        printf("%s = %ld\n", label, r.num);
    else
        printf("%s = %ld/%ld\n", label, r.num, r.den);
}

int main(void) {
    long a, b, c, d;
    Rational r1, r2;
    printf("请输入两个有理数的分子和分母（a b c d 表示 a/b 和 c/d）：");
    scanf("%ld %ld %ld %ld", &a, &b, &c, &d);
    r1 = Make(a, b);
    r2 = Make(c, d);
    Print("r1", r1);
    Print("r2", r2);
    Print("r1 + r2", Add(r1, r2));
    Print("r1 - r2", Sub(r1, r2));
    Print("r1 * r2", Mul(r1, r2));
    printf("r1 的分子 = %ld，分母 = %ld\n", Numerator(r1), Denominator(r1));
    printf("r2 的分子 = %ld，分母 = %ld\n", Numerator(r2), Denominator(r2));
    return 0;
}
</script>
<script type="text/plain" id="c2-2">
#include <stdio.h>
#include <stdlib.h>

typedef struct {
    long num;               /* 分子 */
    long den;               /* 分母，始终为正 */
} Rational;

/* 辗转相除的递归写法 */
long Gcd(long a, long b) {
    if (a < 0) a = -a;
    if (b < 0) b = -b;
    return b == 0 ? a : Gcd(b, a % b);
}

Rational Make(long num, long den) {
    Rational r;
    long g;
    if (den == 0) {
        printf("分母不能为 0\n");
        exit(1);
    }
    if (den < 0) {
        num = -num;
        den = -den;
    }
    g = Gcd(num, den);
    r.num = num / g;
    r.den = den / g;
    return r;
}

/* 加减法用最小公倍数通分，分母不会变成两个分母的乘积 */
Rational AddSub(Rational a, Rational b, int sign) {
    long lcm = a.den / Gcd(a.den, b.den) * b.den;
    return Make(a.num * (lcm / a.den) + sign * b.num * (lcm / b.den), lcm);
}

Rational Add(Rational a, Rational b) { return AddSub(a, b, 1); }
Rational Sub(Rational a, Rational b) { return AddSub(a, b, -1); }

/* 乘法先交叉约分再相乘：a 的分子和 b 的分母约，b 的分子和 a 的分母约 */
Rational Mul(Rational a, Rational b) {
    long g1 = Gcd(a.num, b.den), g2 = Gcd(b.num, a.den);
    return Make((a.num / g1) * (b.num / g2), (a.den / g2) * (b.den / g1));
}

long Numerator(Rational r) { return r.num; }
long Denominator(Rational r) { return r.den; }

void Print(const char *label, Rational r) {
    if (r.den == 1)
        printf("%s = %ld\n", label, r.num);
    else
        printf("%s = %ld/%ld\n", label, r.num, r.den);
}

int main(void) {
    long a, b, c, d;
    Rational r1, r2;
    printf("请输入两个有理数的分子和分母（a b c d 表示 a/b 和 c/d）：");
    scanf("%ld %ld %ld %ld", &a, &b, &c, &d);
    r1 = Make(a, b);
    r2 = Make(c, d);
    Print("r1", r1);
    Print("r2", r2);
    Print("r1 + r2", Add(r1, r2));
    Print("r1 - r2", Sub(r1, r2));
    Print("r1 * r2", Mul(r1, r2));
    printf("r1 的分子 = %ld，分母 = %ld\n", Numerator(r1), Denominator(r1));
    printf("r2 的分子 = %ld，分母 = %ld\n", Numerator(r2), Denominator(r2));
    return 0;
}

void ListDelete(SqList *L, int i) {

    int low = 0, high = L->length - 1, mid, i;
    if (L->length == MAXSIZE)

#include <stdio.h>
#define MAXSIZE 26

typedef struct {
    char elem[MAXSIZE];         /* 按字母顺序存放，不重复 */
    int length;
} Set;

/* 由字符串建立集合：只取小写字母，插入时保持有序并去掉重复 */
void CreateSet(Set *S, const char *str) {
    int i, j;
    S->length = 0;
    for (; *str != '\0'; str++) {
        char c = *str;
        if (c < 'a' || c > 'z')
            continue;
        for (i = 0; i < S->length && S->elem[i] < c; i++)
            ;
        if (i < S->length && S->elem[i] == c)
            continue;               /* 已经有了 */
        for (j = S->length; j > i; j--)
            S->elem[j] = S->elem[j - 1];
        S->elem[i] = c;
        S->length++;
    }
}

/* 并、交、差都是对两个有序表做一趟归并 */
void Union(Set *A, Set *B, Set *C) {
    int i = 0, j = 0;
    C->length = 0;
    while (i < A->length && j < B->length) {
        if (A->elem[i] < B->elem[j])
            C->elem[C->length++] = A->elem[i++];
        else if (A->elem[i] > B->elem[j])
            C->elem[C->length++] = B->elem[j++];
        else {
            C->elem[C->length++] = A->elem[i++];
            j++;
        }
    }
    while (i < A->length) C->elem[C->length++] = A->elem[i++];
    while (j < B->length) C->elem[C->length++] = B->elem[j++];
}

void Intersection(Set *A, Set *B, Set *C) {
    int i = 0, j = 0;
    C->length = 0;
    while (i < A->length && j < B->length) {
        if (A->elem[i] < B->elem[j])
            i++;
        else if (A->elem[i] > B->elem[j])
            j++;
        else {
            C->elem[C->length++] = A->elem[i++];
            j++;
        }
    }
}

void Difference(Set *A, Set *B, Set *C) {
    int i = 0, j = 0;
    C->length = 0;
    while (i < A->length) {
        if (j >= B->length || A->elem[i] < B->elem[j])
            C->elem[C->length++] = A->elem[i++];
        else if (A->elem[i] > B->elem[j])
            j++;
        else {
            i++;
            j++;
        }
    }
}

void Print(const char *name, Set *S) {
    int i;
    printf("%s = {", name);
    for (i = 0; i < S->length; i++)
        printf(i ? ", %c" : "%c", S->elem[i]);
    printf("}\n");
}

int main(void) {
    char s1[100], s2[100];
    Set A, B, C;
    printf("请输入集合 A 的元素：");
    fgets(s1, sizeof s1, stdin);
    printf("请输入集合 B 的元素：");
    fgets(s2, sizeof s2, stdin);
    CreateSet(&A, s1);
    CreateSet(&B, s2);
    Print("A", &A);
    Print("B", &B);
    Union(&A, &B, &C);
    Print("A ∪ B", &C);
    Intersection(&A, &B, &C);
    Print("A ∩ B", &C);
    Difference(&A, &B, &C);
    Print("A - B", &C);
    return 0;
}

            s |= 1u << (*str - 'a');    /* 重复的字母自然只占一位 */
    return s;
}

Set Union(Set a, Set b) { return a | b; }
Set Intersection(Set a, Set b) { return a & b; }
Set Difference(Set a, Set b) { return a & ~b; }

/* 建立 n 个结点的循环单链表，返回尾结点（尾结点的 next 是 1 号） */
Node *CreateRing(int n) {
    Node *head = NULL, *tail = NULL, *s;
    int i;
    for (i = 1; i <= n; i++) {
        s = (Node *)malloc(sizeof(Node));
        s->no = i;
        printf("请输入第 %d 个人的密码：", i);
        scanf("%d", &s->pwd);
        if (head == NULL)
            head = s;
        else
            tail->next = s;
        tail = s;
    }
    tail->next = head;
    return tail;
}

void Josephus(Node *tail, int n, int m) {
    Node *p = tail, *q;     /* p 始终指向下一个报数者的前驱 */
    int left = n, i, step;
    printf("出列顺序：");
    while (left > 0) {
        step = (m - 1) % left;      /* 绕满整圈没有意义，取余减少空转 */
        for (i = 0; i < step; i++)
            p = p->next;
        q = p->next;                /* q 报到 m，出列 */
        printf("%d ", q->no);
        m = q->pwd;
        p->next = q->next;
        free(q);
        left--;
    }
    printf("\n");
}

int main(void) {
    int n, m;
    printf("请输入人数 n 和初始报数上限 m：");
    scanf("%d %d", &n, &m);
    Josephus(CreateRing(n), n, m);

#include <stdio.h>
#include <stdlib.h>

typedef struct PNode {
    double coef;            /* 系数 */
    int expn;               /* 指数 */
    struct PNode *next;
} PNode, *Polynomial;

/* 按指数降序插入一项；指数相同就合并系数，合并后为 0 则删除该项 */
void InsertTerm(Polynomial P, double coef, int expn) {
    PNode *pre = P, *s;
    while (pre->next != NULL && pre->next->expn > expn)
        pre = pre->next;
    if (pre->next != NULL && pre->next->expn == expn) {
        pre->next->coef += coef;
        if (pre->next->coef == 0) {
            s = pre->next;
            pre->next = s->next;
            free(s);
        }
        return;
    }
    if (coef == 0)
        return;
    s = (PNode *)malloc(sizeof(PNode));
    s->coef = coef;
    s->expn = expn;
    s->next = pre->next;
    pre->next = s;
}

/* 1）输入并建立多项式（带头结点） */
Polynomial Create(const char *name) {
    Polynomial P = (Polynomial)malloc(sizeof(PNode));
    int n, i, e;
    double c;
    P->next = NULL;
    printf("请输入多项式 %s 的项数：", name);
    scanf("%d", &n);
    printf("请输入 %d 组 系数 指数：", n);
    for (i = 0; i < n; i++) {
        scanf("%lf %d", &c, &e);
        InsertTerm(P, c, e);
    }
    return P;
}

/* 3）相加：两个降序链表归并，指数大的先放，指数相同则系数相加 */
Polynomial Add(Polynomial A, Polynomial B) {
    Polynomial C = (Polynomial)malloc(sizeof(PNode));
    PNode *pa = A->next, *pb = B->next, *tail = C, *s;
    double c;
    int e;
    while (pa != NULL || pb != NULL) {
        if (pb == NULL || (pa != NULL && pa->expn > pb->expn)) {
            c = pa->coef; e = pa->expn; pa = pa->next;
        } else if (pa == NULL || pb->expn > pa->expn) {
            c = pb->coef; e = pb->expn; pb = pb->next;
        } else {
            c = pa->coef + pb->coef; e = pa->expn;
            pa = pa->next; pb = pb->next;
        }
        if (c != 0) {
            s = (PNode *)malloc(sizeof(PNode));
            s->coef = c;
            s->expn = e;
            tail->next = s;
            tail = s;
        }
    }
    tail->next = NULL;
    return C;
}

/* 2）输出：指数降序，写成 5x^17 + 9x^8 + 3x + 7 的形式 */
void Print(const char *name, Polynomial P) {
    PNode *p = P->next;
    printf("%s = ", name);
    if (p == NULL)
        printf("0");
    for (; p != NULL; p = p->next) {
        double c = p->coef;
        if (p != P->next)
            printf(c < 0 ? " - " : " + ");
        else if (c < 0)
            printf("-");
        if (c < 0)
            c = -c;
        if (c != 1 || p->expn == 0)
            printf("%g", c);
        if (p->expn > 0)
            printf("x");
        if (p->expn > 1)
            printf("^%d", p->expn);
    }
    printf("\n");
}

int main(void) {
    Polynomial A = Create("A"), B = Create("B");
    Print("A", A);
    Print("B", B);
    Print("A + B", Add(A, B));
    return 0;
}

#include <stdio.h>
#define MAXTERMS 100

typedef struct {
    double coef;
    int expn;
} Term;

typedef struct {
    Term data[MAXTERMS];    /* 按指数降序存放 */
    int length;
} Poly;

/* 1）读入各项后按指数降序做直接插入排序，再合并同类项、去掉系数为 0 的项 */
void Create(Poly *P, const char *name) {
    int n, i, j, k;
    Term t;
    printf("请输入多项式 %s 的项数：", name);
    scanf("%d", &n);
    printf("请输入 %d 组 系数 指数：", n);
    for (i = 0; i < n; i++) {
        scanf("%lf %d", &t.coef, &t.expn);
        for (j = i - 1; j >= 0 && P->data[j].expn < t.expn; j--)
            P->data[j + 1] = P->data[j];
        P->data[j + 1] = t;
    }
    k = 0;
    for (i = 0; i < n; i++) {
        if (k > 0 && P->data[k - 1].expn == P->data[i].expn)
            P->data[k - 1].coef += P->data[i].coef;
        else
            P->data[k++] = P->data[i];
        if (P->data[k - 1].coef == 0)
            k--;
    }
    P->length = k;
}

/* 3）相加：i、j 分别指向 A、B 的当前项，指数大的先放进 C */
void Add(Poly *A, Poly *B, Poly *C) {
    int i = 0, j = 0;
    Term t;
    C->length = 0;
    while (i < A->length || j < B->length) {
        if (j >= B->length || (i < A->length && A->data[i].expn > B->data[j].expn)) {
            t = A->data[i++];
        } else if (i >= A->length || B->data[j].expn > A->data[i].expn) {
            t = B->data[j++];
        } else {
            t = A->data[i++];
            t.coef += B->data[j++].coef;
        }
        if (t.coef != 0)
            C->data[C->length++] = t;
    }
}

void Print(const char *name, Poly *P) {
    int i;
    printf("%s = ", name);
    if (P->length == 0)
        printf("0");
    for (i = 0; i < P->length; i++) {
        double c = P->data[i].coef;
        int e = P->data[i].expn;
        if (i > 0)
            printf(c < 0 ? " - " : " + ");
        else if (c < 0)
            printf("-");
        if (c < 0)
            c = -c;
        if (c != 1 || e == 0)
            printf("%g", c);
        if (e > 0)
            printf("x");
        if (e > 1)
            printf("^%d", e);
    }
    printf("\n");
}

int main(void) {
    Poly A, B, C;
    Create(&A, "A");
    Create(&B, "B");
    Add(&A, &B, &C);
    Print("A", &A);
    Print("B", &B);
    Print("A + B", &C);
    return 0;
}

#include <stdio.h>
#include <stdlib.h>
#include <string.h>
#define DATAFILE "goods.txt"

typedef struct Goods {
    int no;                 /* 商品编号，链表按编号递增有序 */
    char name[30];
    int count;
    struct Goods *next;
} Goods;

Goods head = {0, "", 0, NULL};  /* 头结点 */

/* 返回编号为 no 的商品的前驱：它的 next 要么就是该商品，要么是第一个编号更大的商品 */
Goods *FindPre(int no) {
    Goods *pre = &head;
    while (pre->next != NULL && pre->next->no < no)
        pre = pre->next;
    return pre;
}

void Clear(void) {
    Goods *p;
    while (head.next != NULL) {
        p = head.next;
        head.next = p->next;
        free(p);
    }
}

/* 1）入库：已有该商品就加数量，否则按编号插入新结点 */
void StockIn(int no, const char *name, int count) {
    Goods *pre = FindPre(no), *p = pre->next;
    if (p != NULL && p->no == no) {
        p->count += count;
    } else {
        p = (Goods *)malloc(sizeof(Goods));
        p->no = no;
        strcpy(p->name, name);
        p->count = count;
        p->next = pre->next;
        pre->next = p;
    }
    printf("入库：%d %s，现有 %d\n", p->no, p->name, p->count);
}

/* 2）出库：数量减到 0 就从表中删除 */
void StockOut(int no, int count) {
    Goods *pre = FindPre(no), *p = pre->next;
    if (p == NULL || p->no != no) {
        printf("没有编号为 %d 的商品\n", no);
        return;
    }
    if (p->count < count) {
        printf("库存不足：%d %s 只有 %d\n", p->no, p->name, p->count);
        return;
    }
    p->count -= count;
    printf("出库：%d %s，剩余 %d\n", p->no, p->name, p->count);
    if (p->count == 0) {
        pre->next = p->next;
        printf("%s 已售完，从商品表中删除\n", p->name);
        free(p);
    }
}

/* 3）查询 */
void Query(int no) {
    Goods *p = FindPre(no)->next;
    if (p != NULL && p->no == no)
        printf("查询：%d %s，现有 %d\n", p->no, p->name, p->count);
    else
        printf("没有编号为 %d 的商品\n", no);
}

void List(void) {
    Goods *p;
    printf("编号\t名称\t数量\n");
    for (p = head.next; p != NULL; p = p->next)
        printf("%d\t%s\t%d\n", p->no, p->name, p->count);
}

/* 4）营业前恢复：清空链表后从文本文件读回，文件本身有序，尾插即可 */
void Restore(void) {
    FILE *fp = fopen(DATAFILE, "r");
    Goods *tail = &head, *p, t;
    int n = 0;
    Clear();
    if (fp == NULL) {
        printf("没有找到 %s，从空库存开始营业\n", DATAFILE);
        return;
    }
    while (fscanf(fp, "%d %29s %d", &t.no, t.name, &t.count) == 3) {
        p = (Goods *)malloc(sizeof(Goods));
        *p = t;
        p->next = NULL;
        tail->next = p;
        tail = p;
        n++;
    }
    fclose(fp);
    printf("营业前恢复了 %d 种商品\n", n);
}

/* 5）营业结束保存：按编号顺序每行写一种商品 */
void Save(void) {
    FILE *fp = fopen(DATAFILE, "w");
    Goods *p;
    int n = 0;
    if (fp == NULL) {
        printf("无法写入 %s\n", DATAFILE);
        return;
    }
    for (p = head.next; p != NULL; p = p->next, n++)
        fprintf(fp, "%d %s %d\n", p->no, p->name, p->count);
    fclose(fp);
    printf("营业结束，%d 种商品已保存到 %s\n", n, DATAFILE);
}

int main(void) {
    int op, no, count;
    char name[30];
    printf("【菜单】1 入库  2 出库  3 查询  4 列表  5 营业前恢复  6 营业结束保存  0 退出\n");
    while (1) {
        printf("请选择操作：");
        if (scanf("%d", &op) != 1 || op == 0)
            break;
        switch (op) {
        case 1:
            printf("请输入编号 名称 数量：");
            scanf("%d %29s %d", &no, name, &count);
            StockIn(no, name, count);
            break;
        case 2:
            printf("请输入编号 数量：");
            scanf("%d %d", &no, &count);
            StockOut(no, count);
            break;
        case 3:
            printf("请输入编号：");
            scanf("%d", &no);
            Query(no);
            break;
        case 4: List(); break;
        case 5: Restore(); break;
        case 6: Save(); break;
        default: printf("没有这个操作\n");
        }
    }
    Clear();
    return 0;
}

#include <stdio.h>
#include <string.h>
#define MAXN 200
#define DATAFILE "goods.dat"

typedef struct {
    int no;
    char name[30];
    int count;
} Goods;

Goods table[MAXN];          /* 按编号递增有序的顺序表 */
int len = 0;

/* 折半查找：找到返回下标；找不到返回 -1，pos 带回应插入的位置 */
int Search(int no, int *pos) {
    int low = 0, high = len - 1, mid;
    while (low <= high) {
        mid = (low + high) / 2;
        if (table[mid].no == no) {
            *pos = mid;
            return mid;
        }
        if (table[mid].no < no)
            low = mid + 1;
        else
            high = mid - 1;
    }
    *pos = low;
    return -1;
}

void StockIn(int no, const char *name, int count) {
    int pos, i;
    if (Search(no, &pos) < 0) {
        if (len == MAXN) {
            printf("商品表已满\n");
            return;
        }
        for (i = len; i > pos; i--)     /* 后面的商品后移，腾出 pos */
            table[i] = table[i - 1];
        table[pos].no = no;
        strcpy(table[pos].name, name);
        table[pos].count = 0;
        len++;
    }
    table[pos].count += count;
    printf("入库：%d %s，现有 %d\n", no, table[pos].name, table[pos].count);
}

void StockOut(int no, int count) {
    int pos, i;
    Goods *g;
    if (Search(no, &pos) < 0) {
        printf("没有编号为 %d 的商品\n", no);
        return;
    }
    g = &table[pos];
    if (g->count < count) {
        printf("库存不足：%d %s 只有 %d\n", g->no, g->name, g->count);
        return;
    }
    g->count -= count;
    printf("出库：%d %s，剩余 %d\n", g->no, g->name, g->count);
    if (g->count == 0) {
        printf("%s 已售完，从商品表中删除\n", g->name);
        for (i = pos; i < len - 1; i++)
            table[i] = table[i + 1];
        len--;
    }
}

void Query(int no) {
    int pos;
    if (Search(no, &pos) >= 0)
        printf("查询：%d %s，现有 %d\n", no, table[pos].name, table[pos].count);
    else
        printf("没有编号为 %d 的商品\n", no);
}

void List(void) {
    int i;
    printf("编号\t名称\t数量\n");
    for (i = 0; i < len; i++)
        printf("%d\t%s\t%d\n", table[i].no, table[i].name, table[i].count);
}

/* 二进制文件：先写商品种数，再把整个顺序表一次写入 */
void Restore(void) {
    FILE *fp = fopen(DATAFILE, "rb");
    len = 0;
    if (fp == NULL) {
        printf("没有找到 %s，从空库存开始营业\n", DATAFILE);
        return;
    }
    if (fread(&len, sizeof len, 1, fp) != 1 || len < 0 || len > MAXN ||
        fread(table, sizeof(Goods), len, fp) != (size_t)len)
        len = 0;
    fclose(fp);
    printf("营业前恢复了 %d 种商品\n", len);
}

void Save(void) {
    FILE *fp = fopen(DATAFILE, "wb");
    if (fp == NULL) {
        printf("无法写入 %s\n", DATAFILE);
        return;
    }
    fwrite(&len, sizeof len, 1, fp);
    fwrite(table, sizeof(Goods), len, fp);
    fclose(fp);
    printf("营业结束，%d 种商品已保存到 %s\n", len, DATAFILE);
}

int main(void) {
    int op, no, count;
    char name[30];
    printf("【菜单】1 入库  2 出库  3 查询  4 列表  5 营业前恢复  6 营业结束保存  0 退出\n");
    while (1) {
        printf("请选择操作：");
        if (scanf("%d", &op) != 1 || op == 0)
            break;
        switch (op) {
        case 1:
            printf("请输入编号 名称 数量：");
            scanf("%d %29s %d", &no, name, &count);
            StockIn(no, name, count);
            break;
        case 2:
            printf("请输入编号 数量：");
            scanf("%d %d", &no, &count);
            StockOut(no, count);
            break;
        case 3:
            printf("请输入编号：");
            scanf("%d", &no);
            Query(no);
            break;
        case 4: List(); break;
        case 5: Restore(); break;
        case 6: Save(); break;
        default: printf("没有这个操作\n");
        }
    }
    return 0;
}

#include <stdio.h>
#define MAXSIZE 50
#define SHARESIZE 6

typedef struct {
    int data[MAXSIZE];
    int top;                /* 栈顶下标，-1 表示空栈 */
} SqStack;

/* 两栈共享一段空间：1 号栈从左往右长，2 号栈从右往左长 */
typedef struct {
    int data[SHARESIZE];
    int top1, top2;         /* 空时 top1 = -1，top2 = SHARESIZE */
} DqStack;

/* 1）初始化  2）置空：顺序栈只要把 top 归位 */
void InitStack(SqStack *S) { S->top = -1; }
void ClearStack(SqStack *S) { S->top = -1; }

/* 3）入栈 */
void Push(SqStack *S, int x) {
    if (S->top == MAXSIZE - 1) {
        printf("栈满，%d 无法入栈\n", x);
        return;
    }
    S->data[++S->top] = x;
    printf("%d 入栈\n", x);
}

/* 4）出栈 */
void Pop(SqStack *S) {
    if (S->top == -1) {
        printf("栈空，无法出栈\n");
        return;
    }
    printf("出栈：%d\n", S->data[S->top--]);
}

/* 5）打印，从栈底到栈顶 */
void PrintStack(SqStack *S) {
    int i;
    printf("栈底 → 栈顶：");
    if (S->top == -1)
        printf("（空）");
    for (i = 0; i <= S->top; i++)
        printf("%d ", S->data[i]);
    printf("\n");
}

/* 6）两栈共享空间：两个栈顶相邻时空间才算用完 */
void DqPush(DqStack *S, int k, int x) {
    if (S->top1 + 1 == S->top2) {
        printf("共享空间已满，%d 无法入栈\n", x);
        return;
    }
    if (k == 1)
        S->data[++S->top1] = x;
    else
        S->data[--S->top2] = x;
    printf("%d 进入 %d 号栈\n", x, k);
}

void DqPop(DqStack *S, int k) {
    if ((k == 1 && S->top1 == -1) || (k == 2 && S->top2 == SHARESIZE)) {
        printf("%d 号栈空\n", k);
        return;
    }
    if (k == 1)
        printf("1 号栈出栈：%d\n", S->data[S->top1--]);
    else
        printf("2 号栈出栈：%d\n", S->data[S->top2++]);
}

void DqPrint(DqStack *S) {
    int i;
    printf("1 号栈：");
    for (i = 0; i <= S->top1; i++)
        printf("%d ", S->data[i]);
    printf("\n2 号栈：");
    for (i = SHARESIZE - 1; i >= S->top2; i--)
        printf("%d ", S->data[i]);
    printf("\n");
}

int main(void) {
    SqStack S;
    DqStack D = {{0}, -1, SHARESIZE};
    int op, x, k;
    InitStack(&S);
    printf("【菜单】1 初始化  2 置空  3 入栈  4 出栈  5 打印  6 共享栈入栈  7 共享栈出栈  8 打印共享栈  0 退出\n");
    while (1) {
        printf("请选择操作：");
        if (scanf("%d", &op) != 1 || op == 0)
            break;
        switch (op) {
        case 1: InitStack(&S); printf("栈已初始化\n"); break;
        case 2: ClearStack(&S); printf("栈已置空\n"); break;
        case 3: printf("请输入入栈元素："); scanf("%d", &x); Push(&S, x); break;
        case 4: Pop(&S); break;
        case 5: PrintStack(&S); break;
        case 6: printf("请输入栈号(1/2)和元素："); scanf("%d %d", &k, &x); DqPush(&D, k, x); break;
        case 7: printf("请输入栈号(1/2)："); scanf("%d", &k); DqPop(&D, k); break;
        case 8: DqPrint(&D); break;
        default: printf("没有这个操作\n");
        }
    }
    return 0;
}

#include <stdio.h>
#include <stdlib.h>
#include <string.h>
#define STACK_INIT_SIZE 2
#define STACKINCREMENT 2

/* 动态顺序栈：空间用 malloc 分配，满了用 realloc 扩充 */
typedef struct {
    int *base;
    int *top;               /* 指向栈顶元素的下一个位置 */
    int stacksize;
} SqStack;

/* 两栈共享一块动态空间，满了就扩大一倍，并把 2 号栈搬到新空间的右端 */
typedef struct {
    int *base;
    int size;
    int top1;               /* 1 号栈的元素个数，也是下一个空位 */
    int top2;               /* 2 号栈栈顶元素的下标，空时等于 size */
} DqStack;

void InitStack(SqStack *S) {
    S->base = (int *)malloc(STACK_INIT_SIZE * sizeof(int));
    S->top = S->base;
    S->stacksize = STACK_INIT_SIZE;
}

void DestroyStack(SqStack *S) {
    free(S->base);
    S->base = S->top = NULL;
}

void ClearStack(SqStack *S) { S->top = S->base; }

void Push(SqStack *S, int x) {
    if (S->top - S->base == S->stacksize) {
        S->base = (int *)realloc(S->base, (S->stacksize + STACKINCREMENT) * sizeof(int));
        S->top = S->base + S->stacksize;
        S->stacksize += STACKINCREMENT;
        printf("栈满，空间扩充到 %d\n", S->stacksize);
    }
    *S->top++ = x;
    printf("%d 入栈\n", x);
}

void Pop(SqStack *S) {
    if (S->top == S->base) {
        printf("栈空，无法出栈\n");
        return;
    }
    printf("出栈：%d\n", *--S->top);
}

void PrintStack(SqStack *S) {
    int *p;
    printf("栈底 → 栈顶：");
    if (S->top == S->base)
        printf("（空）");
    for (p = S->base; p < S->top; p++)
        printf("%d ", *p);
    printf("\n");
}

void DqInit(DqStack *S) {
    S->size = STACK_INIT_SIZE;
    S->base = (int *)malloc(S->size * sizeof(int));
    S->top1 = 0;
    S->top2 = S->size;
}

void DqPush(DqStack *S, int k, int x) {
    if (S->top1 == S->top2) {
        int n2 = S->size - S->top2, newsize = S->size * 2;
        S->base = (int *)realloc(S->base, newsize * sizeof(int));
        memmove(S->base + newsize - n2, S->base + S->top2, n2 * sizeof(int));
        S->top2 = newsize - n2;
        S->size = newsize;
        printf("共享空间已满，扩充到 %d\n", newsize);
    }
    if (k == 1)
        S->base[S->top1++] = x;
    else
        S->base[--S->top2] = x;
    printf("%d 进入 %d 号栈\n", x, k);
}

void DqPop(DqStack *S, int k) {
    if ((k == 1 && S->top1 == 0) || (k == 2 && S->top2 == S->size)) {
        printf("%d 号栈空\n", k);
        return;
    }
    if (k == 1)
        printf("1 号栈出栈：%d\n", S->base[--S->top1]);
    else
        printf("2 号栈出栈：%d\n", S->base[S->top2++]);
}

void DqPrint(DqStack *S) {
    int i;
    printf("1 号栈：");
    for (i = 0; i < S->top1; i++)
        printf("%d ", S->base[i]);
    printf("\n2 号栈：");
    for (i = S->size - 1; i >= S->top2; i--)
        printf("%d ", S->base[i]);
    printf("\n");
}

int main(void) {
    SqStack S;
    DqStack D;
    int op, x, k;
    InitStack(&S);

#include <stdio.h>
#define MAXSIZE 100

typedef struct {
    char data[MAXSIZE];
    int top;                /* 栈顶下标，-1 表示空栈 */
} SqStack;

void InitStack(SqStack *S) { S->top = -1; }
int StackEmpty(SqStack *S) { return S->top == -1; }

int Push(SqStack *S, char e) {
    if (S->top == MAXSIZE - 1) return 0;
    S->data[++S->top] = e;
    return 1;
}

int Pop(SqStack *S, char *e) {
    if (StackEmpty(S)) return 0;
    *e = S->data[S->top--];
    return 1;
}

/* 返回 1 表示配对，0 表示不配对 */
int Match(const char *exp) {
    SqStack S;
    char e;
    int i;
    InitStack(&S);
    for (i = 0; exp[i] != '\0'; i++) {
        if (exp[i] == '(') {
            Push(&S, '(');
        } else if (exp[i] == ')') {
            if (!Pop(&S, &e))       /* 栈空却读到右括号 */
                return 0;
        }
    }
    return StackEmpty(&S);          /* 表达式结束时栈空才算配对 */
}

int main(void) {
    char exp[MAXSIZE];
    printf("请输入算术表达式：");
    fgets(exp, sizeof exp, stdin);
    printf(Match(exp) ? "括号配对\n" : "括号不配对\n");
    return 0;
}

#include <stdio.h>
#define MAXSIZE 100

/* depth 是还没配对的左括号个数，相当于只记录栈的高度 */
int Match(const char *exp) {
    int depth = 0, i;
    for (i = 0; exp[i] != '\0'; i++) {
        if (exp[i] == '(') {
            depth++;
        } else if (exp[i] == ')') {
            if (depth == 0)         /* 右括号前面没有可配对的左括号 */
                return 0;
            depth--;
        }
    }
    return depth == 0;
}

int main(void) {
    char exp[MAXSIZE];
    printf("请输入算术表达式：");
    fgets(exp, sizeof exp, stdin);
    printf(Match(exp) ? "括号配对\n" : "括号不配对\n");

#include <stdio.h>
#define N 8

int pos[N];                 /* pos[i]：第 i 行皇后所在的列 */
int colUsed[N];             /* 第 j 列是否已有皇后 */
int diag1[2 * N - 1];       /* 主对角线，同一条线上 行-列 相同，下标 i-j+N-1 */
int diag2[2 * N - 1];       /* 副对角线，同一条线上 行+列 相同，下标 i+j */

void PrintBoard(void) {
    int i, j;
    for (i = 0; i < N; i++) {
        for (j = 0; j < N; j++)
            printf(pos[i] == j ? "Q " : ". ");
        printf("\n");
    }
}

/* 从第 row 行开始放皇后，全部放好返回 1 */
int Place(int row) {
    int j;
    if (row == N)
        return 1;
    for (j = 0; j < N; j++) {
        if (colUsed[j] || diag1[row - j + N - 1] || diag2[row + j])
            continue;               /* 冲突，试下一列 */
        pos[row] = j;
        colUsed[j] = diag1[row - j + N - 1] = diag2[row + j] = 1;
        if (Place(row + 1))
            return 1;
        colUsed[j] = diag1[row - j + N - 1] = diag2[row + j] = 0;   /* 回溯 */
    }
    return 0;
}

int main(void) {
    if (Place(0))
        PrintBoard();
    return 0;
}

#include <stdio.h>
#include <stdlib.h>
#define N 8

int pos[N];     /* 当栈用：pos[0..top] 是已放好的各行皇后的列号 */

/* 第 row 行放在第 col 列是否与前面各行冲突 */
int Safe(int row, int col) {
    int i;
    for (i = 0; i < row; i++)
        if (pos[i] == col || abs(pos[i] - col) == row - i)
            return 0;
    return 1;
}

int main(void) {
    int top = 0, i, j;
    pos[0] = -1;                    /* 栈顶这一行从第 0 列开始试 */
    while (top >= 0 && top < N) {
        pos[top]++;
        while (pos[top] < N && !Safe(top, pos[top]))
            pos[top]++;
        if (pos[top] < N) {         /* 这一行放好了，下一行入栈 */
            top++;
            if (top < N)
                pos[top] = -1;
        } else {
            top--;                  /* 这一行无处可放，出栈回到上一行 */
        }
    }
    for (i = 0; i < N; i++) {
        for (j = 0; j < N; j++)
            printf(pos[i] == j ? "Q " : ". ");
        printf("\n");
    }
    return 0;
}

int w[MAXN], n;
int stack[MAXN], top = -1;  /* 栈中存放已放入背包的物品下标 */
int count = 0;

void PrintSolution(void) {
    int i;
    printf("方案 %d：", ++count);
    for (i = 0; i <= top; i++)
        printf("%d ", w[stack[i]]);
    printf("\n");
}

/* 从第 k 件物品开始考虑，背包还剩 rest 的空间 */
void Knap(int k, int rest) {
    int i;
    if (rest == 0) {
        PrintSolution();
        return;
    }
    for (i = k; i < n; i++) {
        if (w[i] <= rest) {
            stack[++top] = i;           /* 放入背包：入栈 */
            Knap(i + 1, rest - w[i]);
            top--;                      /* 取出来：出栈，试下一件 */
        }
    }
}

int main(void) {
    int s, i;
    printf("请输入背包容量 s 和物品件数 n：");
    scanf("%d %d", &s, &n);
    printf("请输入 %d 件物品的重量：", n);
    for (i = 0; i < n; i++)
        scanf("%d", &w[i]);
    Knap(0, s);
    if (count == 0)
        printf("无解\n");
    else
        printf("共 %d 种方案\n", count);
    return 0;
}

#include <stdio.h>
#define MAXN 50

int main(void) {
    int w[MAXN], stack[MAXN], top = -1;
    int s, n, i, k = 0, rest, count = 0;
    printf("请输入背包容量 s 和物品件数 n：");
    scanf("%d %d", &s, &n);
    printf("请输入 %d 件物品的重量：", n);
    for (i = 0; i < n; i++)
        scanf("%d", &w[i]);

    rest = s;
    while (1) {
        while (rest > 0 && k < n) {     /* 从第 k 件起，放得下的就放进去 */
            if (w[k] <= rest) {
                stack[++top] = k;
                rest -= w[k];
            }
            k++;
        }
        if (rest == 0) {                /* 正好装满，栈中就是一组解 */
            printf("方案 %d：", ++count);
            for (i = 0; i <= top; i++)
                printf("%d ", w[stack[i]]);
            printf("\n");
        }
        if (top < 0)                    /* 栈空且所有物品都试过了 */
            break;
        k = stack[top--];               /* 取出最后放入的物品，从它的下一件接着试 */
        rest += w[k];
        k++;
    }
    if (count == 0)
        printf("无解\n");
    else
        printf("共 %d 种方案\n", count);
    return 0;
}

#include <stdio.h>
#include <stdlib.h>
#define MAXN 20

typedef struct {
    int plate;              /* 车牌号 */
    int time;               /* 进入停车场的时刻 */
} Car;

typedef struct {
    Car data[MAXN];
    int top;
} SqStack;                  /* 停车场和临时让路的栈 */

typedef struct QNode {
    Car car;
    struct QNode *next;
} QNode;

typedef struct {
    QNode *front, *rear;    /* 带头结点 */
    int len;
} LinkQueue;                /* 便道 */

int N, price;

void Push(SqStack *S, Car c) { S->data[++S->top] = c; }
Car Pop(SqStack *S) { return S->data[S->top--]; }

void EnQueue(LinkQueue *Q, Car c) {
    QNode *s = (QNode *)malloc(sizeof(QNode));
    s->car = c;
    s->next = NULL;
    Q->rear->next = s;
    Q->rear = s;
    Q->len++;
}

Car DeQueue(LinkQueue *Q) {
    QNode *p = Q->front->next;
    Car c = p->car;
    Q->front->next = p->next;
    if (Q->rear == p)
        Q->rear = Q->front;
    free(p);
    Q->len--;
    return c;
}

void Arrive(SqStack *park, LinkQueue *road, Car c) {
    if (park->top < N - 1) {
        Push(park, c);
        printf("%d 号车停在车位 %d\n", c.plate, park->top + 1);
    } else {
        EnQueue(road, c);
        printf("%d 号车在便道第 %d 位等候\n", c.plate, road->len);
    }
}

void Leave(SqStack *park, SqStack *temp, LinkQueue *road, int plate, int t) {
    Car c;
    int i, found = 0;
    for (i = 0; i <= park->top; i++)
        if (park->data[i].plate == plate)
            found = 1;
    if (!found) {
        printf("%d 号车不在停车场内\n", plate);
        return;
    }
    while (park->data[park->top].plate != plate)
        Push(temp, Pop(park));          /* 在它之后进来的车先退出去让路 */
    c = Pop(park);
    printf("%d 号车离开，停留 %d，交费 %d\n", plate, t - c.time, (t - c.time) * price);
    while (temp->top >= 0)
        Push(park, Pop(temp));          /* 让路的车按原次序开回来 */
    if (road->len > 0) {
        c = DeQueue(road);
        c.time = t;                     /* 从进入停车场这一刻开始计费 */
        Push(park, c);
        printf("%d 号车从便道进入车位 %d\n", c.plate, park->top + 1);
    }
}

int main(void) {
    SqStack park, temp;
    LinkQueue road;
    Car c;
    char op;
    park.top = temp.top = -1;
    road.front = road.rear = (QNode *)malloc(sizeof(QNode));
    road.front->next = NULL;
    road.len = 0;

    printf("请输入停车场容量 N 和单位时间停车费：");
    scanf("%d %d", &N, &price);
    if (N > MAXN)
        N = MAXN;
    while (1) {
        printf("请输入操作（A 到达，D 离开，E 结束）、车牌号、时刻：");
        if (scanf(" %c %d %d", &op, &c.plate, &c.time) != 3 || op == 'E')
            break;
        if (op == 'A')
            Arrive(&park, &road, c);
        else if (op == 'D')
            Leave(&park, &temp, &road, c.plate, c.time);
        else
            printf("操作只能是 A、D 或 E\n");
    }
    return 0;
}

#include <stdio.h>
#include <stdlib.h>
#define QSIZE 21            /* 循环队列，最多 20 辆车在便道等候 */

typedef struct {
    int plate;
    int time;
} Car;

typedef struct SNode {
    Car car;
    struct SNode *next;
} SNode;

typedef struct {
    SNode *top;             /* 链栈，栈顶在表头 */
    int len;
} LinkStack;

typedef struct {
    Car data[QSIZE];
    int front, rear;
} SqQueue;

int N, price;

void Push(LinkStack *S, Car c) {
    SNode *s = (SNode *)malloc(sizeof(SNode));
    s->car = c;
    s->next = S->top;
    S->top = s;
    S->len++;
}

Car Pop(LinkStack *S) {
    SNode *p = S->top;
    Car c = p->car;
    S->top = p->next;
    free(p);
    S->len--;
    return c;
}

int QueueLength(SqQueue *Q) { return (Q->rear - Q->front + QSIZE) % QSIZE; }

void Arrive(LinkStack *park, SqQueue *road, Car c) {
    if (park->len < N) {
        Push(park, c);
        printf("%d 号车停在车位 %d\n", c.plate, park->len);
    } else if ((road->rear + 1) % QSIZE == road->front) {
        printf("便道已满，%d 号车无法等候\n", c.plate);
    } else {
        road->data[road->rear] = c;
        road->rear = (road->rear + 1) % QSIZE;
        printf("%d 号车在便道第 %d 位等候\n", c.plate, QueueLength(road));
    }
}

/* 只用栈操作找车：不是要找的车就挪到临时栈，找到或停车场空了为止 */
void Leave(LinkStack *park, LinkStack *temp, SqQueue *road, int plate, int t) {
    Car c;
    int found = 0;
    while (park->len > 0) {
        c = Pop(park);
        if (c.plate == plate) {
            found = 1;
            break;
        }
        Push(temp, c);
    }
    if (found)
        printf("%d 号车离开，停留 %d，交费 %d\n", plate, t - c.time, (t - c.time) * price);
    while (temp->len > 0)
        Push(park, Pop(temp));
    if (!found) {
        printf("%d 号车不在停车场内\n", plate);
        return;
    }
    if (QueueLength(road) > 0) {
        c = road->data[road->front];
        road->front = (road->front + 1) % QSIZE;
        c.time = t;
        Push(park, c);
        printf("%d 号车从便道进入车位 %d\n", c.plate, park->len);
    }
}

int main(void) {
    LinkStack park = {NULL, 0}, temp = {NULL, 0};
    SqQueue road;
    Car c;
    char op;
    road.front = road.rear = 0;

    printf("请输入停车场容量 N 和单位时间停车费：");
    scanf("%d %d", &N, &price);
    while (1) {
        printf("请输入操作（A 到达，D 离开，E 结束）、车牌号、时刻：");

        if (op == 'A')

        else if (op == 'D')
            Leave(&park, &temp, &road, c.plate, c.time);
        else
            printf("操作只能是 A、D 或 E\n");
    }
    while (park.len > 0)
        Pop(&park);
    return 0;
}

#include <stdio.h>
#include <stdlib.h>
#include <string.h>
#define PER_SESSION 5       /* 每个时间段前 5 位可以做实验 */

typedef struct QNode {
    int id;
    char name[20];
    struct QNode *next;
} QNode;

typedef struct {
    QNode *front, *rear;    /* 带头结点的链队列 */
} LinkQueue;

LinkQueue Q[3];
const char *TIME_NAME[3] = {"时间一（周一下午）", "时间二（周三下午）", "时间三（周五下午）"};

int Length(LinkQueue *q) {
    int n = 0;
    QNode *p;
    for (p = q->front->next; p != NULL; p = p->next)
        n++;
    return n;
}

void EnQueue(LinkQueue *q, QNode *s) {
    s->next = NULL;
    q->rear->next = s;
    q->rear = s;
}

/* 在三个队列中找学号 id，返回所在时间段，pre 带回它的前驱结点 */
int Find(int id, QNode **pre) {
    int t;
    QNode *p;
    for (t = 0; t < 3; t++)
        for (p = Q[t].front; p->next != NULL; p = p->next)
            if (p->next->id == id) {
                *pre = p;
                return t;
            }
    return -1;
}

/* 1）插入：预约排到对应时间段的队尾 */
void Book(int id, const char *name, int t) {
    QNode *pre, *s;
    if (Find(id, &pre) >= 0) {
        printf("%d 已经预约过了\n", id);
        return;
    }
    s = (QNode *)malloc(sizeof(QNode));
    s->id = id;
    strcpy(s->name, name);
    EnQueue(&Q[t], s);
    printf("%s 预约了%s，排第 %d 位\n", name, TIME_NAME[t], Length(&Q[t]));
}

/* 2）删除：队头的前 5 位出队做实验 */
void DoExperiment(int t) {
    QNode *p;
    int k;
    if (Q[t].front->next == NULL) {
        printf("%s没有人预约\n", TIME_NAME[t]);
        return;
    }
    printf("%s做实验：", TIME_NAME[t]);
    for (k = 0; k < PER_SESSION && Q[t].front->next != NULL; k++) {
        p = Q[t].front->next;
        Q[t].front->next = p->next;
        if (Q[t].rear == p)
            Q[t].rear = Q[t].front;
        printf(k ? "，%d %s" : "%d %s", p->id, p->name);
        free(p);
    }
    printf("\n");
}

/* 3）查询  5）输出：按排队顺序列出名单 */
void PrintQueue(int t) {
    QNode *p;
    printf("%s：", TIME_NAME[t]);
    if (Q[t].front->next == NULL)
        printf("无预约");
    for (p = Q[t].front->next; p != NULL; p = p->next)
        printf(p == Q[t].front->next ? "%d %s" : "，%d %s", p->id, p->name);
    printf("\n");
}

/* 4）修改：从原队列中间摘下结点，排到新时间段的队尾 */
void Modify(int id, int t) {
    QNode *pre, *s;
    int old = Find(id, &pre);
    if (old < 0) {
        printf("没有找到学号 %d 的预约\n", id);
        return;
    }
    s = pre->next;
    pre->next = s->next;
    if (Q[old].rear == s)
        Q[old].rear = pre;
    EnQueue(&Q[t], s);
    printf("%s 的预约改到%s，排第 %d 位\n", s->name, TIME_NAME[t], Length(&Q[t]));
}

int ReadTime(void) {
    int t;
    scanf("%d", &t);
    if (t < 1 || t > 3) {
        printf("时间只能是 1、2、3，按 1 处理\n");
        t = 1;
    }
    return t - 1;
}

int main(void) {
    int op, id, t;
    char name[20];
    for (t = 0; t < 3; t++) {
        Q[t].front = Q[t].rear = (QNode *)malloc(sizeof(QNode));
        Q[t].front->next = NULL;
    }
    printf("【菜单】1 预约  2 做实验  3 查询  4 修改预约  5 输出名单  0 退出\n");
    while (1) {
        printf("请选择操作：");
        if (scanf("%d", &op) != 1 || op == 0)
            break;
        switch (op) {
        case 1:
            printf("请输入学号 姓名 时间(1~3)：");
            scanf("%d %19s", &id, name);
            Book(id, name, ReadTime());
            break;
        case 2: printf("请输入时间(1~3)："); DoExperiment(ReadTime()); break;
        case 3: printf("请输入时间(1~3)："); PrintQueue(ReadTime()); break;
        case 4:
            printf("请输入学号 新的时间(1~3)：");
            scanf("%d", &id);
            Modify(id, ReadTime());
            break;
        case 5:
            for (t = 0; t < 3; t++)
                PrintQueue(t);
            break;
        default: printf("没有这个操作\n");
        }
    }
    return 0;
}

        printf("%d 已经预约过了\n", id);
        return;
    }
    s.id = id;
    strcpy(s.name, name);
    if (!EnQueue(&Q[t], s)) {
        printf("%s已约满\n", TIME_NAME[t]);
        return;
    }
    printf("%s 预约了%s，排第 %d 位\n", name, TIME_NAME[t], Length(&Q[t]));
}

void DoExperiment(int t) {
    int k;
    Student s;
    if (Length(&Q[t]) == 0) {
        printf("%s没有人预约\n", TIME_NAME[t]);
        return;
    }
    printf("%s做实验：", TIME_NAME[t]);
    for (k = 0; k < PER_SESSION && Length(&Q[t]) > 0; k++) {
        s = Q[t].data[Q[t].front];
        Q[t].front = (Q[t].front + 1) % QSIZE;
        printf(k ? "，%d %s" : "%d %s", s.id, s.name);
    }
    printf("\n");
}

void PrintQueue(int t) {
    int i;
    Student *s;
    printf("%s：", TIME_NAME[t]);
    if (Length(&Q[t]) == 0)
        printf("无预约");
    for (i = 0; i < Length(&Q[t]); i++) {
        s = &Q[t].data[(Q[t].front + i) % QSIZE];
        printf(i ? "，%d %s" : "%d %s", s->id, s->name);
    }
    printf("\n");
}

/* 修改：把排在第 k 位的学生取出，后面的人依次前移一位，再排到新队列的队尾 */
void Modify(int id, int t) {
    int k, old = Find(id, &k), i, n;
    Student s;
    if (old < 0) {
        printf("没有找到学号 %d 的预约\n", id);
        return;
    }
    if (old != t && (Q[t].rear + 1) % QSIZE == Q[t].front) {
        printf("%s已约满\n", TIME_NAME[t]);
        return;
    }
    n = Length(&Q[old]);
    s = Q[old].data[(Q[old].front + k) % QSIZE];
    for (i = k; i < n - 1; i++)
        Q[old].data[(Q[old].front + i) % QSIZE] = Q[old].data[(Q[old].front + i + 1) % QSIZE];
    Q[old].rear = (Q[old].rear - 1 + QSIZE) % QSIZE;
    EnQueue(&Q[t], s);
    printf("%s 的预约改到%s，排第 %d 位\n", s.name, TIME_NAME[t], Length(&Q[t]));
}

int ReadTime(void) {
    int t;
    scanf("%d", &t);
    if (t < 1 || t > 3) {
        printf("时间只能是 1、2、3，按 1 处理\n");
        t = 1;
    }
    return t - 1;
}

int main(void) {
    int op, id, t;

    for (t = 0; t < 3; t++)
        Q[t].front = Q[t].rear = 0;
    printf("【菜单】1 预约  2 做实验  3 查询  4 修改预约  5 输出名单  0 退出\n");

            scanf("%d %19s", &id, name);
            Book(id, name, ReadTime());
            break;
        case 2: printf("请输入时间(1~3)："); DoExperiment(ReadTime()); break;
        case 3: printf("请输入时间(1~3)："); PrintQueue(ReadTime()); break;
        case 4:
            printf("请输入学号 新的时间(1~3)：");
            scanf("%d", &id);
            Modify(id, ReadTime());
            break;
        case 5:
            for (t = 0; t < 3; t++)
                PrintQueue(t);
            break;
        default: printf("没有这个操作\n");
        }
    }
    return 0;
}

#define MAXQSIZE 64         /* 队列里最多同时有两行，n<=30 时够用 */

typedef struct {
    int data[MAXQSIZE];
    int front, rear;        /* front 指向队头，rear 指向队尾的下一个位置 */
} SqQueue;

void InitQueue(SqQueue *Q) { Q->front = Q->rear = 0; }

void EnQueue(SqQueue *Q, int e) {
    Q->data[Q->rear] = e;
    Q->rear = (Q->rear + 1) % MAXQSIZE;
}

int DeQueue(SqQueue *Q) {
    int e = Q->data[Q->front];
    Q->front = (Q->front + 1) % MAXQSIZE;
    return e;
}

int GetHead(SqQueue *Q) { return Q->data[Q->front]; }

int main(void) {
    SqQueue Q;
    int n, k, j, s;
    printf("请输入行数 n（7<=n<=30）：");

        if (k < n)

            s = DeQueue(&Q);            /* 第 k 行第 j 个数 */

#include <stdio.h>
#include <stdlib.h>

typedef struct QNode {
    int data;
    struct QNode *next;
} QNode;

typedef struct {
    QNode *front, *rear;    /* 带头结点，front 指向头结点 */
} LinkQueue;

void InitQueue(LinkQueue *Q) {
    Q->front = Q->rear = (QNode *)malloc(sizeof(QNode));
    Q->front->next = NULL;
}

void EnQueue(LinkQueue *Q, int e) {
    QNode *s = (QNode *)malloc(sizeof(QNode));
    s->data = e;
    s->next = NULL;
    Q->rear->next = s;
    Q->rear = s;
}

int DeQueue(LinkQueue *Q) {
    QNode *p = Q->front->next;
    int e = p->data;
    Q->front->next = p->next;
    if (Q->rear == p)
        Q->rear = Q->front;
    free(p);
    return e;
}

int main(void) {
    LinkQueue Q;
    int n, k, s, prev;
    printf("请输入行数 n（n>=7）：");
    scanf("%d", &n);
    InitQueue(&Q);
    EnQueue(&Q, 1);
    EnQueue(&Q, 0);                     /* 0 是每一行末尾的分隔符 */
    for (k = 1; k <= n; k++) {
        printf("%*s", (n - k) * 3, "");
        prev = 0;                       /* 把行首左边看成也有一个 0 */
        do {
            s = DeQueue(&Q);
            EnQueue(&Q, prev + s);      /* 相邻两数之和就是下一行的数 */
            if (s != 0)
                printf("%6d", s);
            prev = s;
        } while (s != 0);
        EnQueue(&Q, 0);                 /* 新的一行同样以 0 结尾 */
        printf("\n");
    }
    return 0;
}

        for (a = 0; a < k; a++)
            for (b = 0; b < k; b++)
                if (a != b)
                    conflict[item[a]][item[b]] = 1;
    }
}

    int queue[MAXN + 1], front = 0, rear = 0;   /* 循环队列 */
    int clash[MAXN];        /* clash[j]：项目 j 与本时间段已排项目的冲突数 */
    int group[MAXN], g = 0, pre, i, j;
    ReadInput();
    for (i = 0; i < n; i++)
        queue[rear++] = i;

    while (front != rear) {

            g++;
            for (j = 0; j < n; j++)
                clash[j] = 0;

            group[i] = g;
            for (j = 0; j < n; j++)
                clash[j] += conflict[i][j];
        } else {                    /* 有冲突，重新入队等下一个时间段 */

    return 0;
}

int conflict[MAXN][MAXN];
int color[MAXN];            /* color[i]：项目 i 安排在第几个时间段 */
int n;

void ReadInput(void) {
    int m, k, i, a, b, item[MAXN];
    printf("请输入比赛项目数：");
    scanf("%d", &n);
    printf("请输入运动员人数：");

        printf("请输入第 %d 位运动员参加的项目数和项目号：", i + 1);
        scanf("%d", &k);
        for (a = 0; a < k; a++)
            scanf("%d", &item[a]);
        for (a = 0; a < k; a++)
            for (b = 0; b < k; b++)
                if (a != b)
                    conflict[item[a]][item[b]] = 1;
    }
}

/* 用 k 个时间段给第 i 个及以后的项目排期，成功返回 1 */
int Try(int i, int k) {
    int c, j;
    if (i == n)
        return 1;
    for (c = 1; c <= k; c++) {
        for (j = 0; j < i; j++)
            if (conflict[i][j] && color[j] == c)
                break;
        if (j == i) {               /* 与前面同时间段的项目都不冲突 */
            color[i] = c;
            if (Try(i + 1, k))
                return 1;
        }
    }
    return 0;                       /* 回溯：第 i 个项目放哪里都不行 */
}

    for (k = 1; k <= n; k++)        /* 时间段数从 1 开始试，第一个成功的就是最少的 */
        if (Try(0, k))

    for (c = 1; c <= k; c++) {

        for (i = 0; i < n; i++)

}

#include <stdio.h>
#define MAXLEN 255

typedef struct {
    char ch[MAXLEN + 1];
    int length;
} SString;                  /* 定长顺序串 */

/* 1）赋值 */
void StrAssign(SString *S, const char *chars) {
    int i;
    for (i = 0; chars[i] != '\0' && i < MAXLEN; i++)
        S->ch[i] = chars[i];
    S->ch[i] = '\0';
    S->length = i;
}

/* 2）求串长 */
int StrLength(SString *S) { return S->length; }

/* 3）联接：超过最大长度的部分截断 */
void Concat(SString *T, SString *S1, SString *S2) {
    int i, k = 0;
    for (i = 0; i < S1->length; i++)
        T->ch[k++] = S1->ch[i];
    for (i = 0; i < S2->length && k < MAXLEN; i++)
        T->ch[k++] = S2->ch[i];
    T->ch[k] = '\0';
    T->length = k;
}

/* 4）求子串：从第 pos 个字符起长度为 len，pos 从 1 开始 */
int SubString(SString *Sub, SString *S, int pos, int len) {
    int i;
    if (pos < 1 || pos > S->length || len < 0 || pos + len - 1 > S->length)
        return 0;
    for (i = 0; i < len; i++)
        Sub->ch[i] = S->ch[pos - 1 + i];
    Sub->ch[len] = '\0';
    Sub->length = len;
    return 1;
}

/* 5）比较：S > T 返回正数，相等返回 0，S < T 返回负数 */
int StrCompare(SString *S, SString *T) {
    int i;
    for (i = 0; i < S->length && i < T->length; i++)
        if (S->ch[i] != T->ch[i])
            return S->ch[i] - T->ch[i];
    return S->length - T->length;
}

/* 6）朴素模式匹配：返回 T 在 S 中第一次出现的位置，没有返回 0 */
int Index(SString *S, SString *T) {
    int i = 0, j = 0;
    while (i < S->length && j < T->length) {
        if (S->ch[i] == T->ch[j]) {
            i++;
            j++;
        } else {
            i = i - j + 1;          /* 主串回到本趟起点的下一个字符 */
            j = 0;
        }
    }
    return j == T->length ? i - T->length + 1 : 0;
}

int main(void) {
    char a[MAXLEN + 1], b[MAXLEN + 1];
    SString S, T, R;
    int pos, len, cmp, k;
    printf("请输入主串 S 和模式串 T：");
    scanf("%255s %255s", a, b);
    printf("请输入取子串的起始位置和长度：");
    scanf("%d %d", &pos, &len);

    StrAssign(&S, a);
    StrAssign(&T, b);
    printf("赋值：S = %s，T = %s\n", S.ch, T.ch);
    printf("串长：S 长 %d，T 长 %d\n", StrLength(&S), StrLength(&T));
    Concat(&R, &S, &T);
    printf("联接：S + T = %s\n", R.ch);
    if (SubString(&R, &S, pos, len))
        printf("子串：S 从第 %d 个字符起长 %d 的子串是 %s\n", pos, len, R.ch);
    else
        printf("子串：位置或长度不合法\n");
    cmp = StrCompare(&S, &T);
    printf("比较：S %s T\n", cmp > 0 ? ">" : cmp < 0 ? "<" : "=");
    k = Index(&S, &T);
    if (k)
        printf("匹配：T 在 S 中的位置是 %d\n", k);
    else
        printf("匹配：S 中没有 T\n");
    return 0;
}

#include <stdio.h>
#include <stdlib.h>
#include <string.h>

typedef struct {
    char *ch;               /* 按实际长度 malloc，没有 '\0' 结尾 */
    int length;
} HString;                  /* 堆分配串 */

void StrAssign(HString *S, const char *chars) {
    int len = (int)strlen(chars);
    free(S->ch);
    S->ch = len ? (char *)malloc(len) : NULL;
    memcpy(S->ch, chars, len);
    S->length = len;
}

int StrLength(HString *S) { return S->length; }

/* 联接：按两串长度之和申请新空间，没有长度上限 */
void Concat(HString *T, HString *S1, HString *S2) {
    free(T->ch);
    T->length = S1->length + S2->length;
    T->ch = (char *)malloc(T->length);
    memcpy(T->ch, S1->ch, S1->length);
    memcpy(T->ch + S1->length, S2->ch, S2->length);
}

int SubString(HString *Sub, HString *S, int pos, int len) {
    if (pos < 1 || pos > S->length || len < 0 || pos + len - 1 > S->length)
        return 0;
    free(Sub->ch);
    Sub->ch = len ? (char *)malloc(len) : NULL;
    memcpy(Sub->ch, S->ch + pos - 1, len);
    Sub->length = len;
    return 1;
}

int StrCompare(HString *S, HString *T) {
    int i;
    for (i = 0; i < S->length && i < T->length; i++)
        if (S->ch[i] != T->ch[i])
            return S->ch[i] - T->ch[i];
    return S->length - T->length;
}

/* next[j]：T[j] 失配时 j 应退回的位置，next[0] = -1 */
void GetNext(HString *T, int next[]) {
    int i = 0, j = -1;
    next[0] = -1;
    while (i < T->length - 1) {
        if (j == -1 || T->ch[i] == T->ch[j]) {
            i++;
            j++;
            next[i] = j;
        } else {
            j = next[j];
        }
    }
}

/* KMP：主串指针 i 从不回退 */
int IndexKMP(HString *S, HString *T, int next[]) {
    int i = 0, j = 0;
    while (i < S->length && j < T->length) {
        if (j == -1 || S->ch[i] == T->ch[j]) {
            i++;
            j++;
        } else {
            j = next[j];
        }
    }
    return j == T->length ? i - T->length + 1 : 0;
}

void Print(HString *S) { printf("%.*s", S->length, S->ch); }

int main(void) {
    char a[256], b[256];
    HString S = {NULL, 0}, T = {NULL, 0}, R = {NULL, 0};
    int pos, len, cmp, k, *next;
    printf("请输入主串 S 和模式串 T：");
    scanf("%255s %255s", a, b);
    printf("请输入取子串的起始位置和长度：");
    scanf("%d %d", &pos, &len);

    StrAssign(&S, a);
    StrAssign(&T, b);
    printf("赋值：S = "); Print(&S); printf("，T = "); Print(&T); printf("\n");
    printf("串长：S 长 %d，T 长 %d\n", StrLength(&S), StrLength(&T));
    Concat(&R, &S, &T);
    printf("联接：S + T = "); Print(&R); printf("\n");
    if (SubString(&R, &S, pos, len)) {
        printf("子串：S 从第 %d 个字符起长 %d 的子串是 ", pos, len);
        Print(&R);
        printf("\n");
    } else {
        printf("子串：位置或长度不合法\n");
    }
    cmp = StrCompare(&S, &T);
    printf("比较：S %s T\n", cmp > 0 ? ">" : cmp < 0 ? "<" : "=");

    next = (int *)malloc(T.length * sizeof(int));
    GetNext(&T, next);
    printf("匹配：T 的 next 数组为");
    for (k = 0; k < T.length; k++)
        printf(" %d", next[k]);
    k = IndexKMP(&S, &T, next);
    if (k)
        printf("，T 在 S 中的位置是 %d\n", k);
    else
        printf("，S 中没有 T\n");
    free(next);
    free(S.ch);
    free(T.ch);
    free(R.ch);
    return 0;
}

#include <stdio.h>
#define MAXN 19

int a[MAXN + 1][MAXN + 1];  /* 下标从 1 开始，与题目一致 */

/* 按题目给的规则填：共 n 轮，每轮 n 个数 */
void Fill(int n) {
    int i = (n + 1) / 2, j = n, k;  /* 1 放在中间一行的最后一列 */
    a[i][j] = 1;
    for (k = 2; k <= n * n; k++) {
        if ((k - 1) % n == 0) {     /* 新一轮的第一个数：同一行的左边一列 */
            j = (j == 1) ? n : j - 1;
        } else {                    /* 本轮其余的数：右下方，出界就绕到第一行或第一列 */
            i = (i == n) ? 1 : i + 1;
            j = (j == n) ? 1 : j + 1;
        }
        a[i][j] = k;
    }
}

/* 检查每行、每列和两条对角线之和是否都等于 n(n²+1)/2 */
int Check(int n) {
    int target = n * (n * n + 1) / 2, i, j, r, c, d1 = 0, d2 = 0;
    for (i = 1; i <= n; i++) {
        r = c = 0;
        for (j = 1; j <= n; j++) {
            r += a[i][j];
            c += a[j][i];
        }
        if (r != target || c != target)
            return 0;
        d1 += a[i][i];
        d2 += a[i][n + 1 - i];
    }
    return d1 == target && d2 == target;
}

int main(void) {
    int n, i, j;
    printf("请输入奇数 n：");
    scanf("%d", &n);
    if (n < 1 || n > MAXN || n % 2 == 0) {
        printf("n 必须是 1 ~ %d 之间的奇数\n", MAXN);
        return 1;
    }
    Fill(n);
    for (i = 1; i <= n; i++) {
        for (j = 1; j <= n; j++)
            printf("%4d", a[i][j]);
        printf("\n");
    }
    if (Check(n))
        printf("每行、每列和两条对角线之和都是 %d\n", n * (n * n + 1) / 2);
    else
        printf("不是魔方阵\n");
    return 0;
}

#include <stdio.h>
#define MAXN 19

int a[MAXN + 1][MAXN + 1];

/* 楼梯法：1 放在第一行中间，之后每个数放在右上方，
   出界就绕到另一边；右上方已经有数，就改放到正下方 */
void Fill(int n) {
    int i = 1, j = (n + 1) / 2, k, ni, nj;
    a[i][j] = 1;
    for (k = 2; k <= n * n; k++) {
        ni = (i == 1) ? n : i - 1;
        nj = (j == n) ? 1 : j + 1;
        if (a[ni][nj] != 0) {
            ni = (i == n) ? 1 : i + 1;
            nj = j;
        }
        i = ni;
        j = nj;
        a[i][j] = k;
    }
}

int Check(int n) {
    int target = n * (n * n + 1) / 2, i, j, r, c, d1 = 0, d2 = 0;
    for (i = 1; i <= n; i++) {
        r = c = 0;
        for (j = 1; j <= n; j++) {
            r += a[i][j];
            c += a[j][i];
        }
        if (r != target || c != target)
            return 0;
        d1 += a[i][i];
        d2 += a[i][n + 1 - i];
    }
    return d1 == target && d2 == target;
}

int main(void) {
    int n, i, j;
    printf("请输入奇数 n：");
    scanf("%d", &n);
    if (n < 1 || n > MAXN || n % 2 == 0) {
        printf("n 必须是 1 ~ %d 之间的奇数\n", MAXN);
        return 1;
    }
    Fill(n);
    for (i = 1; i <= n; i++) {
        for (j = 1; j <= n; j++)
            printf("%4d", a[i][j]);
        printf("\n");
    }
    if (Check(n))
        printf("每行、每列和两条对角线之和都是 %d\n", n * (n * n + 1) / 2);
    else
        printf("不是魔方阵\n");
    return 0;
}

#include <stdio.h>
#include <stdlib.h>
#include <string.h>

typedef struct Node {
    char name[20];
    char phone[20];
    char group[16];
    struct Node *next;
} Node;

Node head = {"", "", "", NULL};     /* 头结点 */

/* 返回姓名为 name 的结点的前驱，找不到返回 NULL */
Node *FindPre(const char *name) {
    Node *pre;
    for (pre = &head; pre->next != NULL; pre = pre->next)
        if (strcmp(pre->next->name, name) == 0)
            return pre;
    return NULL;
}

/* 添加：尾插，保持录入顺序 */
void Add(const char *name, const char *phone, const char *group) {
    Node *tail = &head, *s;
    if (FindPre(name) != NULL) {
        printf("已经有联系人 %s\n", name);
        return;
    }
    while (tail->next != NULL)
        tail = tail->next;
    s = (Node *)malloc(sizeof(Node));
    strcpy(s->name, name);
    strcpy(s->phone, phone);
    strcpy(s->group, group);
    s->next = NULL;
    tail->next = s;
    printf("已添加：%s %s %s\n", name, phone, group);
}

void Query(const char *name) {
    Node *pre = FindPre(name);
    if (pre == NULL)
        printf("查无此人：%s\n", name);
    else
        printf("查询：%s %s %s\n", pre->next->name, pre->next->phone, pre->next->group);
}

void Modify(const char *name, const char *phone, const char *group) {
    Node *pre = FindPre(name);
    if (pre == NULL) {
        printf("查无此人：%s\n", name);
        return;
    }
    strcpy(pre->next->phone, phone);
    strcpy(pre->next->group, group);
    printf("已修改：%s %s %s\n", name, phone, group);
}

/* 删除：找到前驱后改一个指针，不需要移动其他联系人 */
void Delete(const char *name) {
    Node *pre = FindPre(name), *p;
    if (pre == NULL) {
        printf("查无此人：%s\n", name);
        return;
    }
    p = pre->next;
    pre->next = p->next;
    free(p);
    printf("已删除：%s\n", name);
}

/* 统计：对每个分组，只在它第一次出现时数一遍同组人数 */
void Statistics(void) {
    Node *p, *q;
    int total = 0, first = 1, k;

        total++;
    printf("共 %d 人", total);
    for (p = head.next; p != NULL; p = p->next) {
        for (q = head.next; q != p && strcmp(q->group, p->group) != 0; q = q->next)
            ;
        if (q != p)                 /* 前面已经出现过这个分组 */
            continue;
        for (k = 0, q = p; q != NULL; q = q->next)
            if (strcmp(q->group, p->group) == 0)
                k++;
        printf(first ? "：%s %d 人" : "，%s %d 人", p->group, k);
        first = 0;
    }
    printf("\n");
}

void List(void) {
    Node *p;
    printf("姓名\t电话\t\t分组\n");
    for (p = head.next; p != NULL; p = p->next)
        printf("%s\t%s\t%s\n", p->name, p->phone, p->group);
}

int main(void) {
    int op;
    char name[20], phone[20], group[16];
    Node *p;
    printf("【菜单】1 添加  2 查询  3 修改  4 删除  5 统计  6 列表  0 退出\n");
    while (1) {
        printf("请选择操作：");
        if (scanf("%d", &op) != 1 || op == 0)
            break;
        switch (op) {
        case 1:
            printf("请输入姓名 电话 分组：");
            scanf("%19s %19s %15s", name, phone, group);
            Add(name, phone, group);
            break;
        case 2: printf("请输入姓名："); scanf("%19s", name); Query(name); break;
        case 3:
            printf("请输入姓名 新电话 新分组：");
            scanf("%19s %19s %15s", name, phone, group);
            Modify(name, phone, group);
            break;
        case 4: printf("请输入姓名："); scanf("%19s", name); Delete(name); break;
        case 5: Statistics(); break;
        case 6: List(); break;
        default: printf("没有这个操作\n");
        }
    }
    while (head.next != NULL) {
        p = head.next;
        head.next = p->next;
        free(p);
    }

#include <stdio.h>
#define MAXSIZE 100         /* 非零元个数上限 */
#define MAXRC 20            /* 行数、列数上限 */

typedef struct {
    int i, j;               /* 行号、列号，从 1 开始 */
    int e;
} Triple;

typedef struct {
    Triple data[MAXSIZE + 1];   /* data[1..tu]，按行序、列序递增 */
    int rpos[MAXRC + 1];        /* rpos[r]：第 r 行第一个非零元在 data 中的位置 */
    int mu, nu, tu;
} RLSMatrix;

/* 先数出每行的非零元个数，再累加得到每行的起始位置 */
void SetRpos(RLSMatrix *M) {
    int num[MAXRC + 1] = {0}, r, t;
    for (t = 1; t <= M->tu; t++)
        num[M->data[t].i]++;
    M->rpos[1] = 1;
    for (r = 2; r <= M->mu; r++)
        M->rpos[r] = M->rpos[r - 1] + num[r - 1];
}

/* 输入三元组，用直接插入排序整理成行序，允许任意顺序输入 */
void Input(RLSMatrix *M, const char *name) {
    int t, k;
    Triple x;
    printf("请输入矩阵 %s 的行数 列数 非零元个数：", name);
    scanf("%d %d %d", &M->mu, &M->nu, &M->tu);
    printf("请输入 %d 个非零元的 行 列 值：", M->tu);
    for (t = 1; t <= M->tu; t++) {
        scanf("%d %d %d", &x.i, &x.j, &x.e);
        for (k = t - 1; k >= 1 && (M->data[k].i > x.i || (M->data[k].i == x.i && M->data[k].j > x.j)); k--)
            M->data[k + 1] = M->data[k];
        M->data[k + 1] = x;
    }
    SetRpos(M);
}

/* 加减：两个三元组表都按行列有序，像归并一样一趟扫描；sign 为 1 是加，-1 是减 */
void AddSub(RLSMatrix *A, RLSMatrix *B, RLSMatrix *C, int sign) {
    int p = 1, q = 1, cmp;
    Triple t;
    C->mu = A->mu;
    C->nu = A->nu;
    C->tu = 0;
    while (p <= A->tu || q <= B->tu) {
        if (p > A->tu)
            cmp = 1;
        else if (q > B->tu)
            cmp = -1;
        else if (A->data[p].i != B->data[q].i)
            cmp = A->data[p].i - B->data[q].i;
        else
            cmp = A->data[p].j - B->data[q].j;
        if (cmp < 0) {
            t = A->data[p++];
        } else if (cmp > 0) {
            t = B->data[q++];
            t.e *= sign;
        } else {
            t = A->data[p++];
            t.e += sign * B->data[q++].e;
        }
        if (t.e != 0)               /* 相加后为 0 的元素不保留 */
            C->data[++C->tu] = t;
    }
    SetRpos(C);
}

/* 乘法：借助 rpos 直接找到 N 中第 brow 行的非零元，每行结果先累加在 ctemp 中 */
int Mult(RLSMatrix *M, RLSMatrix *N, RLSMatrix *Q) {
    int arow, brow, ccol, p, q, tp, t;
    int ctemp[MAXRC + 1];
    if (M->nu != N->mu)
        return 0;
    Q->mu = M->mu;
    Q->nu = N->nu;
    Q->tu = 0;
    for (arow = 1; arow <= M->mu; arow++) {
        for (ccol = 1; ccol <= Q->nu; ccol++)
            ctemp[ccol] = 0;
        tp = (arow < M->mu) ? M->rpos[arow + 1] : M->tu + 1;
        for (p = M->rpos[arow]; p < tp; p++) {
            brow = M->data[p].j;
            t = (brow < N->mu) ? N->rpos[brow + 1] : N->tu + 1;
            for (q = N->rpos[brow]; q < t; q++)
                ctemp[N->data[q].j] += M->data[p].e * N->data[q].e;
        }
        for (ccol = 1; ccol <= Q->nu; ccol++) {
            if (ctemp[ccol] != 0) {
                Q->tu++;
                Q->data[Q->tu].i = arow;
                Q->data[Q->tu].j = ccol;
                Q->data[Q->tu].e = ctemp[ccol];
            }
        }
    }
    SetRpos(Q);
    return 1;
}

/* 以通常的阵列形式输出 */
void Print(const char *title, RLSMatrix *M) {
    int r, c, t = 1;
    printf("%s =\n", title);
    for (r = 1; r <= M->mu; r++) {
        for (c = 1; c <= M->nu; c++) {
            if (t <= M->tu && M->data[t].i == r && M->data[t].j == c)
                printf("%5d", M->data[t++].e);
            else
                printf("%5d", 0);
        }
        printf("\n");
    }
}

int main(void) {
    RLSMatrix A, B, C;
    Input(&A, "A");
    Input(&B, "B");
    if (A.mu == B.mu && A.nu == B.nu) {
        AddSub(&A, &B, &C, 1);
        Print("A + B", &C);
        AddSub(&A, &B, &C, -1);
        Print("A - B", &C);
    } else {
        printf("A、B 行列数不同，不能相加减\n");
    }
    if (Mult(&A, &B, &C))
        Print("A × B", &C);
    else
        printf("A 的列数不等于 B 的行数，不能相乘\n");
    return 0;
}

} TSMatrix;

void Input(TSMatrix *M, const char *name) {

    }
}

void AddSub(TSMatrix *A, TSMatrix *B, TSMatrix *C, int sign) {
    int p = 1, q = 1, cmp;
    Triple t;
    C->mu = A->mu;
    C->nu = A->nu;
    C->tu = 0;
    while (p <= A->tu || q <= B->tu) {

            cmp = 1;
        else if (q > B->tu)
            cmp = -1;
        else if (A->data[p].i != B->data[q].i)
            cmp = A->data[p].i - B->data[q].i;
        else
            cmp = A->data[p].j - B->data[q].j;
        if (cmp < 0) {
            t = A->data[p++];
        } else if (cmp > 0) {
            t = B->data[q++];
            t.e *= sign;
        } else {
            t = A->data[p++];
            t.e += sign * B->data[q++].e;
        }
        if (t.e != 0)
            C->data[++C->tu] = t;
    }
}

/* 乘法：没有 rpos，A 的每个非零元 (i,k) 都要扫描 B 的全部非零元，挑出第 k 行的相乘 */
int Mult(TSMatrix *A, TSMatrix *B, TSMatrix *C) {
    int p, q, row, col, ctemp[MAXRC + 1];
    if (A->nu != B->mu)
        return 0;
    C->mu = A->mu;
    C->nu = B->nu;
    C->tu = 0;
    p = 1;
    for (row = 1; row <= A->mu; row++) {
        for (col = 1; col <= C->nu; col++)
            ctemp[col] = 0;
        for (; p <= A->tu && A->data[p].i == row; p++)     /* A 按行有序，第 row 行是连续的一段 */
            for (q = 1; q <= B->tu; q++)
                if (B->data[q].i == A->data[p].j)
                    ctemp[B->data[q].j] += A->data[p].e * B->data[q].e;
        for (col = 1; col <= C->nu; col++) {
            if (ctemp[col] != 0) {
                C->tu++;
                C->data[C->tu].i = row;
                C->data[C->tu].j = col;
                C->data[C->tu].e = ctemp[col];
            }
        }
    }
    return 1;
}

}

#include <stdio.h>
#include <stdlib.h>
#include <string.h>
#include <ctype.h>
#define MAXSIZE 100

double opnd[MAXSIZE];       /* 操作数栈 */
char optr[MAXSIZE];         /* 运算符栈 */
int topN, topR;

int Prior(char op) {
    if (op == '+' || op == '-') return 1;
    if (op == '*' || op == '/') return 2;
    return 0;               /* '(' 优先级最低，只有遇到 ')' 才弹出 */
}

/* 弹出一个运算符和两个操作数，计算后压回操作数栈，并显示这一步 */
int Calc(void) {
    char op = optr[topR--];
    double b = opnd[topN--], a = opnd[topN--], r;
    if (op == '/' && b == 0) {
        printf("  错误：除数为 0\n");
        return 0;
    }
    r = op == '+' ? a + b : op == '-' ? a - b : op == '*' ? a * b : a / b;
    printf("  %g %c %g = %g\n", a, op, b, r);
    opnd[++topN] = r;
    return 1;
}

/* 算符优先法求值。expect 表示当前位置应该出现操作数（1）还是运算符（0），用来发现语法错误 */
int Evaluate(const char *s, double *result) {
    int i = 0, expect = 1;
    char *end;
    topN = topR = -1;
    while (s[i] != '\0' && s[i] != '\n' && s[i] != '\r') {
        char c = s[i];
        if (c == ' ') {
            i++;
        } else if (isdigit((unsigned char)c)) {
            if (!expect) {
                printf("  错误：第 %d 个字符前缺少运算符\n", i + 1);
                return 0;
            }
            opnd[++topN] = strtod(s + i, &end);
            i = (int)(end - s);
            expect = 0;
        } else if (c == '(') {
            if (!expect) {
                printf("  错误：第 %d 个字符前缺少运算符\n", i + 1);
                return 0;
            }
            optr[++topR] = c;
            i++;
        } else if (c == ')') {
            if (expect) {
                printf("  错误：第 %d 个字符前缺少操作数\n", i + 1);
                return 0;
            }
            while (topR >= 0 && optr[topR] != '(')
                if (!Calc())
                    return 0;
            if (topR < 0) {
                printf("  错误：第 %d 个字符是多余的右括号\n", i + 1);
                return 0;
            }
            topR--;         /* 弹出与之配对的左括号 */
            i++;
        } else if (c == '+' || c == '-' || c == '*' || c == '/') {
            if (expect) {
                printf("  错误：第 %d 个字符前缺少操作数\n", i + 1);
                return 0;
            }
            while (topR >= 0 && Prior(optr[topR]) >= Prior(c))
                if (!Calc())
                    return 0;
            optr[++topR] = c;
            expect = 1;
            i++;
        } else {
            printf("  错误：第 %d 个字符不合法\n", i + 1);
            return 0;
        }
    }
    if (expect) {
        printf("  错误：表达式不完整\n");
        return 0;
    }
    while (topR >= 0) {
        if (optr[topR] == '(') {
            printf("  错误：缺少右括号\n");
            return 0;
        }
        if (!Calc())
            return 0;
    }
    *result = opnd[topN];
    return 1;
}

int main(void) {
    char line[MAXSIZE];
    double r;
    printf("请输入算术表达式（每行一个，空行结束）：");
    while (fgets(line, sizeof line, stdin) != NULL && line[0] != '\n') {

            printf("  结果 = %g\n", r);
    }

}

#include <stdio.h>
#include <stdlib.h>
#include <string.h>
#include <ctype.h>
#define MAXSIZE 100

typedef struct {
    int isNum;
    double value;
    char op;
} Token;

int Prior(char op) {
    if (op == '+' || op == '-') return 1;
    if (op == '*' || op == '/') return 2;
    return 0;
}

/* 第一步：中缀转后缀，同时检查语法；成功返回后缀式的长度，失败返回 -1 */
int ToPostfix(const char *s, Token post[]) {
    char stack[MAXSIZE];
    int top = -1, n = 0, i = 0, expect = 1;
    char *end;
    while (s[i] != '\0') {
        char c = s[i];
        if (c == ' ') {
            i++;
            continue;
        }
        if (isdigit((unsigned char)c)) {
            if (!expect) { printf("  错误：第 %d 个字符前缺少运算符\n", i + 1); return -1; }
            post[n].isNum = 1;
            post[n++].value = strtod(s + i, &end);
            i = (int)(end - s);
            expect = 0;
            continue;
        }
        if (c == '(') {
            if (!expect) { printf("  错误：第 %d 个字符前缺少运算符\n", i + 1); return -1; }
            stack[++top] = c;
        } else if (c == ')') {
            if (expect) { printf("  错误：第 %d 个字符前缺少操作数\n", i + 1); return -1; }
            while (top >= 0 && stack[top] != '(') {
                post[n].isNum = 0;
                post[n++].op = stack[top--];
            }
            if (top < 0) { printf("  错误：第 %d 个字符是多余的右括号\n", i + 1); return -1; }
            top--;
        } else if (strchr("+-*/", c)) {
            if (expect) { printf("  错误：第 %d 个字符前缺少操作数\n", i + 1); return -1; }
            while (top >= 0 && Prior(stack[top]) >= Prior(c)) {
                post[n].isNum = 0;
                post[n++].op = stack[top--];
            }
            stack[++top] = c;
            expect = 1;
        } else {
            printf("  错误：第 %d 个字符不合法\n", i + 1);
            return -1;
        }
        i++;
    }
    if (expect) { printf("  错误：表达式不完整\n"); return -1; }
    while (top >= 0) {
        if (stack[top] == '(') { printf("  错误：缺少右括号\n"); return -1; }
        post[n].isNum = 0;
        post[n++].op = stack[top--];
    }
    return n;
}

/* 第二步：后缀式求值，数字入栈，遇到运算符弹出两个数计算 */
int EvalPostfix(Token post[], int n, double *result) {
    double stack[MAXSIZE], a, b, r;
    int top = -1, k;
    for (k = 0; k < n; k++) {
        if (post[k].isNum) {
            stack[++top] = post[k].value;
            continue;
        }
        b = stack[top--];
        a = stack[top--];
        if (post[k].op == '/' && b == 0) {
            printf("  错误：除数为 0\n");
            return 0;
        }
        switch (post[k].op) {
        case '+': r = a + b; break;
        case '-': r = a - b; break;
        case '*': r = a * b; break;
        default:  r = a / b;
        }
        printf("  %g %c %g = %g\n", a, post[k].op, b, r);
        stack[++top] = r;
    }
    *result = stack[top];
    return 1;
}

int main(void) {
    char line[MAXSIZE];
    Token post[MAXSIZE];
    int n, k;
    double r;
    printf("请输入算术表达式（每行一个，空行结束）：");
    while (fgets(line, sizeof line, stdin) != NULL && line[0] != '\n') {
        line[strcspn(line, "\r\n")] = '\0';
        printf("表达式：%s\n", line);
        n = ToPostfix(line, post);
        if (n < 0)
            continue;
        printf("  后缀式：");
        for (k = 0; k < n; k++) {
            if (post[k].isNum)
                printf("%g ", post[k].value);
            else
                printf("%c ", post[k].op);
        }
        printf("\n");
        if (EvalPostfix(post, n, &r))
            printf("  结果 = %g\n", r);
    }
    return 0;
}

#include <stdio.h>
#define MAXN 9

/* 双向栈：调度站从数组左端往右长，输出序列从右端往左长，共用一块空间 */
int space[MAXN];
int top1 = -1, top2 = MAXN;
int n, count = 0;

void PrintSeq(void) {
    int i;
    for (i = MAXN - 1; i >= top2; i--)  /* 从栈底（右端）到栈顶就是出站顺序 */
        printf("%d", space[i]);
    printf(++count % 7 == 0 ? "\n" : "  ");
}

/* next 是下一节等待进站的车厢号 */
void Dispatch(int next) {
    int x;
    if (next > n && top1 == -1) {       /* 全部车厢都已出站 */
        PrintSeq();
        return;
    }
    if (top1 >= 0) {                    /* 选择一：调度站栈顶的车厢出站 */
        x = space[top1--];
        space[--top2] = x;
        Dispatch(next);
        top2++;                         /* 恢复现场，再试另一种选择 */
        space[++top1] = x;
    }
    if (next <= n) {                    /* 选择二：下一节车厢进站 */
        space[++top1] = next;
        Dispatch(next + 1);
        top1--;
    }
}

int main(void) {
    printf("请输入车厢数 n（1~%d）：", MAXN);
    scanf("%d", &n);
    if (n < 1 || n > MAXN) {
        printf("n 超出范围\n");
        return 1;
    }
    Dispatch(1);
    if (count % 7 != 0)
        printf("\n");
    printf("共 %d 种出站序列\n", count);
    return 0;
}

#include <stdio.h>
#define MAXN 9

int perm[MAXN], n;

/* 用双向栈模拟调度，判断 perm 能否作为出站序列：左端是调度站，右端放已出站的车厢 */
int IsValid(void) {
    int space[MAXN], top1 = -1, top2 = MAXN, next = 1, k;
    for (k = 0; k < n; k++) {
        while (next <= perm[k])         /* 要出站的车厢还没进站，就让它及之前的车厢进站 */
            space[++top1] = next++;
        if (space[top1] != perm[k])     /* 它被压在下面，出不来 */
            return 0;
        space[--top2] = space[top1--];
    }
    return 1;
}

/* 按字典序生成下一个排列，已是最后一个时返回 0 */
int NextPerm(void) {
    int i = n - 2, j, t;
    while (i >= 0 && perm[i] > perm[i + 1])
        i--;
    if (i < 0)
        return 0;
    j = n - 1;
    while (perm[j] < perm[i])
        j--;
    t = perm[i]; perm[i] = perm[j]; perm[j] = t;
    for (i++, j = n - 1; i < j; i++, j--) {
        t = perm[i]; perm[i] = perm[j]; perm[j] = t;
    }
    return 1;
}

int main(void) {
    int i, count = 0, total = 0;
    printf("请输入车厢数 n（1~%d）：", MAXN);
    scanf("%d", &n);
    if (n < 1 || n > MAXN) {
        printf("n 超出范围\n");
        return 1;
    }
    for (i = 0; i < n; i++)
        perm[i] = i + 1;
    do {
        total++;
        if (IsValid()) {
            for (i = 0; i < n; i++)
                printf("%d", perm[i]);
            printf(++count % 7 == 0 ? "\n" : "  ");
        }
    } while (NextPerm());
    if (count % 7 != 0)
        printf("\n");
    printf("检查了 %d 个排列，其中 %d 种可以作为出站序列\n", total, count);
    return 0;
}

#include <stdio.h>
#include <stdlib.h>
#include <string.h>

typedef enum { ATOM, LIST } ElemTag;

/* 头尾链表：表结点的 hp 指向表头元素，tp 指向表尾（剩下的元素组成的表）。空表用 NULL 表示 */
typedef struct GLNode {
    ElemTag tag;
    char atom;
    struct GLNode *hp, *tp;
} GLNode, *GList;

const char *s;              /* 解析位置 */

GList CreateElem(void);

/* 解析一个表，s 指向 '(' */
GList CreateList(void) {
    GList head = NULL, *pp = &head, p;
    s++;
    if (*s == ')') {
        s++;
        return NULL;
    }
    while (1) {
        p = (GList)malloc(sizeof(GLNode));
        p->tag = LIST;
        p->hp = CreateElem();
        p->tp = NULL;
        *pp = p;
        pp = &p->tp;
        if (*s++ != ',')    /* 读到 ')'，这一层结束 */
            break;
    }
    return head;
}

GList CreateElem(void) {
    GList p;
    if (*s == '(')
        return CreateList();
    p = (GList)malloc(sizeof(GLNode));
    p->tag = ATOM;
    p->atom = *s++;
    p->hp = p->tp = NULL;
    return p;
}

/* 检查括号配对、只含字母、逗号位置正确 */
int Valid(const char *str) {
    int depth = 0;
    char prev = 0;
    if (str[0] != '(')
        return 0;
    for (; *str; prev = *str++) {
        if (*str == '(') {
            if (prev && prev != '(' && prev != ',') return 0;
            depth++;
        } else if (*str == ')') {
            if (prev == ',' || --depth < 0) return 0;
        } else if (*str == ',') {
            if (prev == '(' || prev == ',' || depth == 0) return 0;
        } else if ((*str >= 'a' && *str <= 'z') || (*str >= 'A' && *str <= 'Z')) {
            if (prev != '(' && prev != ',') return 0;
        } else {
            return 0;
        }
        if (depth == 0 && str[1] != '\0') return 0;
    }
    return depth == 0;
}

void PrintList(GList L);

void PrintElem(GList e) {
    if (e == NULL)
        printf("()");
    else if (e->tag == ATOM)
        printf("%c", e->atom);
    else
        PrintList(e);
}

void PrintList(GList L) {
    printf("(");
    for (; L != NULL; L = L->tp) {
        PrintElem(L->hp);
        if (L->tp != NULL)
            printf(",");
    }
    printf(")");
}

GList GetHead(GList L) { return L->hp; }
GList GetTail(GList L) { return L->tp; }

int Find(GList L, char x) {
    if (L == NULL)
        return 0;
    if (L->tag == ATOM)
        return L->atom == x;
    return Find(L->hp, x) || Find(L->tp, x);
}

int main(void) {
    char str[200], x;
    GList L;
    printf("请输入广义表：");
    scanf("%199s", str);
    printf("请输入要查找的原子：");
    scanf(" %c", &x);
    if (!Valid(str)) {
        printf("广义表格式不正确\n");
        return 1;
    }
    s = str;
    L = CreateList();
    printf("广义表：");
    PrintList(L);
    printf("\n");
    if (L == NULL) {
        printf("空表没有表头和表尾\n");
    } else {
        printf("表头：");
        PrintElem(GetHead(L));
        printf("\n表尾：");
        PrintList(GetTail(L));
        printf("\n");
        if (GetTail(L) != NULL) {
            printf("表尾的表头：");
            PrintElem(GetHead(GetTail(L)));
            printf("\n");
        }
    }
    printf("查找 %c：%s\n", x, Find(L, x) ? "找到了" : "没有找到");
    return 0;
}

#include <stdio.h>
