typedef enum { ATOM, LIST } ElemTag;

/* 扩展线性链表：每个元素一个结点，tp 指向同一层的下一个元素；
   子表结点的 hp 指向子表的第一个元素，空表是一个 hp 为 NULL 的子表结点 */
typedef struct GLNode {
    ElemTag tag;
    char atom;
    struct GLNode *hp, *tp;
} GLNode, *GList;

const char *s;

GList CreateElem(void) {
    GList p = (GList)malloc(sizeof(GLNode)), *pp;
    p->tp = p->hp = NULL;
    if (*s != '(') {
        p->tag = ATOM;
        p->atom = *s++;
        return p;
    }
    p->tag = LIST;
    s++;
    if (*s == ')') {
        s++;
        return p;
    }
    pp = &p->hp;
    while (1) {
        *pp = CreateElem();
        pp = &(*pp)->tp;
        if (*s++ != ',')
            break;
    }
    return p;
}

int Valid(const char *str) {
    int depth = 0;
    char prev = 0;
    if (str[0] != '(')
        return 0;
    for (; *str; prev = *str++) {
        if (*str == '(') {
            if (prev && prev != '(' && prev != ',') return 0;
            depth++;
        } else if (*str == ')') {
            if (prev == ',' || --depth < 0) return 0;
        } else if (*str == ',') {
            if (prev == '(' || prev == ',' || depth == 0) return 0;
        } else if ((*str >= 'a' && *str <= 'z') || (*str >= 'A' && *str <= 'Z')) {
            if (prev != '(' && prev != ',') return 0;
        } else {
            return 0;
        }
        if (depth == 0 && str[1] != '\0') return 0;
    }
    return depth == 0;
}

/* 只输出这个元素本身，不跟着 tp 输出后面的兄弟 */
void Print(GList e) {
    GList p;
    if (e->tag == ATOM) {
        printf("%c", e->atom);
        return;
    }
    printf("(");
    for (p = e->hp; p != NULL; p = p->tp) {
        Print(p);
        if (p->tp != NULL)
            printf(",");
    }
    printf(")");
}

/* 表头就是第一个元素 */
GList GetHead(GList L) { return L->hp; }

/* 表尾：新建一个子表结点，让它的 hp 指向第二个元素，与原表共享后面的结点 */
GList GetTail(GList L) {
    GList t = (GList)malloc(sizeof(GLNode));
    t->tag = LIST;
    t->hp = L->hp->tp;
    t->tp = NULL;
    return t;
}

int Find(GList e, char x) {
    GList p;
    if (e->tag == ATOM)
        return e->atom == x;
    for (p = e->hp; p != NULL; p = p->tp)
        if (Find(p, x))
            return 1;
    return 0;
}

int main(void) {
    char str[200], x;
    GList L, T;
    printf("请输入广义表：");

    }

    printf("\n");
    if (L->hp == NULL) {
        printf("空表没有表头和表尾\n");
    } else {
        printf("表头：");
        Print(GetHead(L));
        T = GetTail(L);
        printf("\n表尾：");
        Print(T);
        printf("\n");
        if (T->hp != NULL) {
            printf("表尾的表头：");
            Print(GetHead(T));
            printf("\n");
        }
        free(T);
    }
    printf("查找 %c：%s\n", x, Find(L, x) ? "找到了" : "没有找到");
    return 0;
}

#include <stdio.h>
#include <stdlib.h>
#include <string.h>
#define BASE 10000

/* 双向循环链表，每个结点存四位（0 ~ 9999）。head->next 是最高位组，head->prior 是最低位组 */
typedef struct DNode {
    int data;
    struct DNode *prior, *next;
} DNode;

typedef struct {
    DNode *head;
    int sign;               /* 1 或 -1 */
    int len;                /* 组数 */
} LongInt;

void Init(LongInt *a) {
    a->head = (DNode *)malloc(sizeof(DNode));
    a->head->prior = a->head->next = a->head;
    a->sign = 1;
    a->len = 0;
}

/* 在最高位之前插入一组 */
void InsertHigh(LongInt *a, int v) {
    DNode *s = (DNode *)malloc(sizeof(DNode));
    s->data = v;
    s->prior = a->head;
    s->next = a->head->next;
    a->head->next->prior = s;
    a->head->next = s;
    a->len++;
}

/* 去掉高位多余的 0 组；值为 0 时符号为正 */
void Normalize(LongInt *a) {
    DNode *p;
    while (a->len > 1 && a->head->next->data == 0) {
        p = a->head->next;
        a->head->next = p->next;
        p->next->prior = a->head;
        free(p);
        a->len--;
    }
    if (a->len == 0)
        InsertHigh(a, 0);
    if (a->len == 1 && a->head->next->data == 0)
        a->sign = 1;
}

/* 读入 "-2345,6789,3211"：逗号只起分隔作用，从最低位起每四位组成一个结点 */
void Parse(LongInt *a, const char *str) {
    char digits[1200];
    int len = 0, i, k, v;
    Init(a);
    for (; *str; str++) {
        if (*str == '-' && len == 0)
            a->sign = -1;
        else if (*str >= '0' && *str <= '9' && len < 1200)
            digits[len++] = *str;
    }
    for (i = len; i > 0; i -= 4) {
        v = 0;
        for (k = (i >= 4 ? i - 4 : 0); k < i; k++)
            v = v * 10 + digits[k] - '0';
        InsertHigh(a, v);
    }
    Normalize(a);
}

void Destroy(LongInt *a) {
    DNode *p = a->head->next, *q;
    while (p != a->head) {
        q = p->next;
        free(p);
        p = q;
    }
    free(a->head);
}

/* 比较绝对值：组数多的大；组数相同从最高位组往低位比 */
int CmpAbs(LongInt *a, LongInt *b) {
    DNode *p, *q;
    if (a->len != b->len)
        return a->len - b->len;
    for (p = a->head->next, q = b->head->next; p != a->head; p = p->next, q = q->next)
        if (p->data != q->data)
            return p->data - q->data;
    return 0;
}

/* |a| + |b|：从最低位组（prior 方向）开始逐组相加 */
void AddAbs(LongInt *a, LongInt *b, LongInt *c) {
    DNode *p = a->head->prior, *q = b->head->prior;
    int carry = 0, sum;
    while (p != a->head || q != b->head || carry) {
        sum = carry;
        if (p != a->head) { sum += p->data; p = p->prior; }
        if (q != b->head) { sum += q->data; q = q->prior; }
        InsertHigh(c, sum % BASE);
        carry = sum / BASE;
    }
}

/* |a| - |b|，要求 |a| >= |b| */
void SubAbs(LongInt *a, LongInt *b, LongInt *c) {
    DNode *p = a->head->prior, *q = b->head->prior;
    int borrow = 0, d;
    while (p != a->head) {
        d = p->data - borrow;
        p = p->prior;
        if (q != b->head) {
            d -= q->data;
            q = q->prior;
        }
        borrow = d < 0;
        InsertHigh(c, borrow ? d + BASE : d);
    }
}

/* c = a + sign·b：符号相同时绝对值相加，不同时大减小，符号跟绝对值大的走 */
void AddSub(LongInt *a, LongInt *b, LongInt *c, int sign) {
    int sb = b->sign * sign;
    Init(c);
    if (a->sign == sb) {
        AddAbs(a, b, c);
        c->sign = a->sign;
    } else if (CmpAbs(a, b) >= 0) {
        SubAbs(a, b, c);
        c->sign = a->sign;
    } else {
        SubAbs(b, a, c);
        c->sign = sb;
    }
    Normalize(c);
}

/* 按习惯每四位一组输出，最高位组不补 0 */
void Print(const char *label, LongInt *a) {
    DNode *p = a->head->next;
    printf("%s = %s%d", label, a->sign < 0 ? "-" : "", p->data);
    for (p = p->next; p != a->head; p = p->next)
        printf(",%04d", p->data);
    printf("\n");
}

int main(void) {
    char s1[1300], s2[1300];
    LongInt a, b, c;
    printf("请输入第一个长整数：");
    fgets(s1, sizeof s1, stdin);
    printf("请输入第二个长整数：");
    fgets(s2, sizeof s2, stdin);
    Parse(&a, s1);
    Parse(&b, s2);
    Print("a", &a);
    Print("b", &b);
    AddSub(&a, &b, &c, 1);
    Print("a + b", &c);
    Destroy(&c);
    AddSub(&a, &b, &c, -1);
    Print("a - b", &c);
    Destroy(&c);
    Destroy(&a);
    Destroy(&b);
    return 0;
}

#include <stdio.h>
#include <stdlib.h>
#define BASE 10000

/* 单链表，低位组在前：相加相减时从表头开始，正好从低位算起 */
typedef struct LNode {
    int data;
    struct LNode *next;
} LNode;

typedef struct {
    LNode *low;             /* 最低位组，不带头结点 */
    int sign;
    int len;
} LongInt;

/* 在高位端（表尾）追加一组 */
void Append(LongInt *a, LNode ***tail, int v) {
    LNode *s = (LNode *)malloc(sizeof(LNode));
    s->data = v;
    s->next = NULL;
    **tail = s;
    *tail = &s->next;
    a->len++;
}

/* 去掉高位（表尾）多余的 0 组 */
void Normalize(LongInt *a) {
    LNode *p, *lastNonZero = a->low;
    int k = 1, keep = 1;
    for (p = a->low; p != NULL; p = p->next, k++)
        if (p->data != 0) {
            lastNonZero = p;
            keep = k;
        }
    p = lastNonZero->next;
    lastNonZero->next = NULL;
    while (p != NULL) {
        LNode *q = p->next;
        free(p);
        p = q;
    }
    a->len = keep;
    if (a->len == 1 && a->low->data == 0)
        a->sign = 1;
}

void Parse(LongInt *a, const char *str) {
    char digits[1200];
    int len = 0, i, k, v;
    LNode **tail = &a->low;
    a->low = NULL;
    a->sign = 1;
    a->len = 0;
    for (; *str; str++) {
        if (*str == '-' && len == 0)
            a->sign = -1;
        else if (*str >= '0' && *str <= '9' && len < 1200)
            digits[len++] = *str;
    }
    for (i = len; i > 0; i -= 4) {      /* 先取最低的四位，依次追加到表尾 */
        v = 0;
        for (k = (i >= 4 ? i - 4 : 0); k < i; k++)
            v = v * 10 + digits[k] - '0';
        Append(a, &tail, v);
    }
    if (a->len == 0)
        Append(a, &tail, 0);
    Normalize(a);
}

void Destroy(LongInt *a) {
    LNode *p = a->low, *q;
    while (p != NULL) {
        q = p->next;
        free(p);
        p = q;
    }
}

/* 组数相同时，高位在表尾，先递归比较后面的组，后面相等才比当前组 */
int CmpGroups(LNode *p, LNode *q) {
    int r;
    if (p == NULL)
        return 0;
    r = CmpGroups(p->next, q->next);
    return r != 0 ? r : p->data - q->data;
}

int CmpAbs(LongInt *a, LongInt *b) {
    if (a->len != b->len)
        return a->len - b->len;
    return CmpGroups(a->low, b->low);
}

void AddAbs(LongInt *a, LongInt *b, LongInt *c) {
    LNode *p = a->low, *q = b->low, **tail = &c->low;
    int carry = 0, sum;
    while (p != NULL || q != NULL || carry) {
        sum = carry;
        if (p != NULL) { sum += p->data; p = p->next; }
        if (q != NULL) { sum += q->data; q = q->next; }
        Append(c, &tail, sum % BASE);
        carry = sum / BASE;
    }
}

void SubAbs(LongInt *a, LongInt *b, LongInt *c) {
    LNode *p = a->low, *q = b->low, **tail = &c->low;
    int borrow = 0, d;
    for (; p != NULL; p = p->next) {
        d = p->data - borrow;
        if (q != NULL) {
            d -= q->data;
            q = q->next;
        }
        borrow = d < 0;
        Append(c, &tail, borrow ? d + BASE : d);
    }
}

void AddSub(LongInt *a, LongInt *b, LongInt *c, int sign) {
    int sb = b->sign * sign;
    c->low = NULL;
    c->len = 0;
    if (a->sign == sb) {
        AddAbs(a, b, c);
        c->sign = a->sign;
    } else if (CmpAbs(a, b) >= 0) {
        SubAbs(a, b, c);
        c->sign = a->sign;
    } else {
        SubAbs(b, a, c);
        c->sign = sb;
    }
    Normalize(c);
}

/* 高位在表尾，用递归倒着输出：先输出后面的高位组，再输出当前组 */
void PrintGroups(LNode *p) {
    if (p->next == NULL) {
        printf("%d", p->data);
        return;
    }
    PrintGroups(p->next);
    printf(",%04d", p->data);
}

void Print(const char *label, LongInt *a) {
    printf("%s = %s", label, a->sign < 0 ? "-" : "");
    PrintGroups(a->low);
    printf("\n");
}

int main(void) {
    char s1[1300], s2[1300];
    LongInt a, b, c;
    printf("请输入第一个长整数：");
    fgets(s1, sizeof s1, stdin);
    printf("请输入第二个长整数：");
    fgets(s2, sizeof s2, stdin);
    Parse(&a, s1);
    Parse(&b, s2);
    Print("a", &a);
    Print("b", &b);
    AddSub(&a, &b, &c, 1);
    Print("a + b", &c);
    Destroy(&c);
    AddSub(&a, &b, &c, -1);
    Print("a - b", &c);
    Destroy(&c);
    Destroy(&a);
    Destroy(&b);
    return 0;
}

#include <stdio.h>
#include <stdlib.h>

typedef struct PNode {
    double coef;
    int expn;
    struct PNode *next;
} PNode, *Polynomial;

/* 按指数降序插入，指数相同则合并 */
void InsertTerm(Polynomial P, double coef, int expn) {
    PNode *pre = P, *s;
    while (pre->next != NULL && pre->next->expn > expn)
        pre = pre->next;
    if (pre->next != NULL && pre->next->expn == expn) {
        pre->next->coef += coef;
        if (pre->next->coef == 0) {
            s = pre->next;
            pre->next = s->next;
            free(s);
        }
        return;
    }
    if (coef == 0)
        return;
    s = (PNode *)malloc(sizeof(PNode));
    s->coef = coef;
    s->expn = expn;
    s->next = pre->next;
    pre->next = s;
}

Polynomial Create(const char *name) {
    Polynomial P = (Polynomial)malloc(sizeof(PNode));
    int n, i, e;
    double c;
    P->next = NULL;
    printf("请输入多项式 %s 的项数：", name);
    scanf("%d", &n);
    printf("请输入 %d 组 系数 指数：", n);
    for (i = 0; i < n; i++) {
        scanf("%lf %d", &c, &e);
        InsertTerm(P, c, e);
    }
    return P;
}

/* C = A + sign·B：两个降序链表归并，减法就是把 B 的系数取反再加 */
Polynomial AddSub(Polynomial A, Polynomial B, int sign) {
    Polynomial C = (Polynomial)malloc(sizeof(PNode));
    PNode *pa = A->next, *pb = B->next, *tail = C, *s;
    double c;
    int e;
    while (pa != NULL || pb != NULL) {
        if (pb == NULL || (pa != NULL && pa->expn > pb->expn)) {
            c = pa->coef; e = pa->expn; pa = pa->next;
        } else if (pa == NULL || pb->expn > pa->expn) {
            c = sign * pb->coef; e = pb->expn; pb = pb->next;
        } else {
            c = pa->coef + sign * pb->coef; e = pa->expn;
            pa = pa->next; pb = pb->next;
        }
        if (c != 0) {
            s = (PNode *)malloc(sizeof(PNode));
            s->coef = c;
            s->expn = e;
            tail->next = s;
            tail = s;
        }
    }
    tail->next = NULL;
    return C;
}

void Print(const char *name, Polynomial P) {
    PNode *p = P->next;
    printf("%s = ", name);
    if (p == NULL)
        printf("0");
    for (; p != NULL; p = p->next) {
        double c = p->coef;
        if (p != P->next)
            printf(c < 0 ? " - " : " + ");
        else if (c < 0)
            printf("-");
        if (c < 0)
            c = -c;
        if (c != 1 || p->expn == 0)
            printf("%g", c);
        if (p->expn > 0)
            printf("x");
        if (p->expn > 1)
            printf("^%d", p->expn);
    }
    printf("\n");
}

int main(void) {
    Polynomial A = Create("A"), B = Create("B");
    Print("A", A);
    Print("B", B);
    Print("A + B", AddSub(A, B, 1));
    Print("A - B", AddSub(A, B, -1));
    return 0;
}

#include <stdio.h>
#define MAXE 100            /* 指数范围 0 ~ 100 */

typedef struct {
    double coef[MAXE + 1];  /* coef[e] 就是 x^e 的系数 */
    int high;               /* 最高次数，-1 表示零多项式 */
} Poly;

void FixHigh(Poly *P) {
    P->high = MAXE;
    while (P->high >= 0 && P->coef[P->high] == 0)
        P->high--;
}

/* 系数直接累加到对应下标，同类项自动合并，也不用排序 */
void Create(Poly *P, const char *name) {
    int n, i, e;
    double c;
    for (e = 0; e <= MAXE; e++)
        P->coef[e] = 0;
    printf("请输入多项式 %s 的项数：", name);
    scanf("%d", &n);
    printf("请输入 %d 组 系数 指数：", n);
    for (i = 0; i < n; i++) {
        scanf("%lf %d", &c, &e);
        if (e < 0 || e > MAXE)
            printf("指数 %d 超出范围，忽略\n", e);
        else
            P->coef[e] += c;
    }
    FixHigh(P);
}

/* 按下标逐项相加减 */
void AddSub(Poly *A, Poly *B, Poly *C, int sign) {
    int e;
    for (e = 0; e <= MAXE; e++)
        C->coef[e] = A->coef[e] + sign * B->coef[e];
    FixHigh(C);
}

/* 从最高次往下输出非零项 */
void Print(const char *name, Poly *P) {
    int e, first = 1;
    printf("%s = ", name);
    if (P->high < 0)
        printf("0");
    for (e = P->high; e >= 0; e--) {
        double c = P->coef[e];
        if (c == 0)
            continue;
        if (!first)
            printf(c < 0 ? " - " : " + ");
        else if (c < 0)
            printf("-");
        if (c < 0)
            c = -c;
        if (c != 1 || e == 0)
            printf("%g", c);
        if (e > 0)
            printf("x");
        if (e > 1)
            printf("^%d", e);
        first = 0;
    }
    printf("\n");
}

int main(void) {
    Poly A, B, C;
    Create(&A, "A");
    Create(&B, "B");
    Print("A", &A);
    Print("B", &B);
    AddSub(&A, &B, &C, 1);
    Print("A + B", &C);
    AddSub(&A, &B, &C, -1);
    Print("A - B", &C);
    return 0;
}

#include <stdio.h>
#include <stdlib.h>
#define MAXR 20

int maze[MAXR + 2][MAXR + 2];   /* 四周加一圈 1 作围墙，省去越界判断；2 表示走过 */
int m, n;
int di[5] = {0, 0, 1, 0, -1};   /* 方向 1 东  2 南  3 西  4 北 */
int dj[5] = {0, 1, 0, -1, 0};

typedef struct SNode {
    int i, j, d;                /* 坐标，以及从这里走向下一格的方向 */
    struct SNode *next;
} SNode;

typedef SNode *LinkStack;       /* 链栈，栈顶在表头 */

void Push(LinkStack *S, int i, int j, int d) {
    SNode *s = (SNode *)malloc(sizeof(SNode));
    s->i = i;
    s->j = j;
    s->d = d;
    s->next = *S;
    *S = s;
}

void Pop(LinkStack *S) {
    SNode *p = *S;
    *S = p->next;
    free(p);
}

/* 非递归：栈顶格子依次试四个方向，能走就把下一格入栈，四个方向都试过就出栈退回 */
int MazePath(LinkStack *S) {
    SNode *top;
    int ni, nj;
    Push(S, 1, 1, 0);
    maze[1][1] = 2;
    while (*S != NULL) {
        top = *S;
        if (top->i == m && top->j == n)
            return 1;
        if (++top->d > 4) {
            Pop(S);
            continue;
        }
        ni = top->i + di[top->d];
        nj = top->j + dj[top->d];
        if (maze[ni][nj] == 0) {
            maze[ni][nj] = 2;
            Push(S, ni, nj, 0);
        }
    }
    return 0;
}

int main(void) {
    LinkStack S = NULL, R = NULL;
    int i, j, k = 0;
    printf("请输入迷宫的行数和列数：");
    scanf("%d %d", &m, &n);
    printf("请输入迷宫（0 通路，1 墙）：");
    for (i = 0; i <= m + 1; i++)
        for (j = 0; j <= n + 1; j++)
            maze[i][j] = 1;
    for (i = 1; i <= m; i++)
        for (j = 1; j <= n; j++)
            scanf("%d", &maze[i][j]);
    if (maze[1][1] != 0 || !MazePath(&S)) {
        printf("没有通路\n");
        return 0;
    }
    S->d = 0;                   /* 出口没有下一步 */
    while (S != NULL) {         /* 栈顶是出口，倒到另一个栈里，入口就到了栈顶 */
        Push(&R, S->i, S->j, S->d);
        Pop(&S);
    }
    printf("通路：\n");
    for (; R != NULL; Pop(&R)) {
        printf("(%d,%d,%d)%s", R->i, R->j, R->d, ++k % 5 == 0 ? "\n" : " ");
        maze[R->i][R->j] = 3;
    }
    if (k % 5 != 0)
        printf("\n");
    for (i = 1; i <= m; i++) {
        for (j = 1; j <= n; j++)
            printf("%s", maze[i][j] == 1 ? "# " : maze[i][j] == 3 ? "* " : ". ");
        printf("\n");
    }
    return 0;
}

int di[5] = {0, 0, 1, 0, -1};   /* 方向 1 东  2 南  3 西  4 北 */
int dj[5] = {0, 1, 0, -1, 0};

typedef struct SNode {
    int i, j, d;
    struct SNode *next;
} SNode;

typedef SNode *LinkStack;
LinkStack path = NULL;

void Push(LinkStack *S, int i, int j, int d) {
    SNode *s = (SNode *)malloc(sizeof(SNode));
    s->i = i;
    s->j = j;
    s->d = d;
    s->next = *S;
    *S = s;
}

/* 递归：从 (i,j) 出发能否走到出口。成功后在返回途中把每一格压栈，
   先压出口、最后压入口，所以入口在栈顶，顺着栈输出就是正向路径 */
int Search(int i, int j) {
    int d;
    maze[i][j] = 2;
    if (i == m && j == n) {
        Push(&path, i, j, 0);
        return 1;
    }
    for (d = 1; d <= 4; d++) {
        if (maze[i + di[d]][j + dj[d]] == 0 && Search(i + di[d], j + dj[d])) {
            Push(&path, i, j, d);
            return 1;
        }
    }
    return 0;
}

int main(void) {
    SNode *p;
    int i, j, k = 0;

        for (j = 1; j <= n; j++)
            scanf("%d", &maze[i][j]);
    if (maze[1][1] != 0 || !Search(1, 1)) {
        printf("没有通路\n");
        return 0;
    }
    printf("通路：\n");
    while (path != NULL) {
        p = path;
        printf("(%d,%d,%d)%s", p->i, p->j, p->d, ++k % 5 == 0 ? "\n" : " ");
        maze[p->i][p->j] = 3;
        path = p->next;
        free(p);
    }
    if (k % 5 != 0)
        printf("\n");
    for (i = 1; i <= m; i++) {
        for (j = 1; j <= n; j++)
            printf("%s", maze[i][j] == 1 ? "# " : maze[i][j] == 3 ? "* " : ". ");
        printf("\n");
    }
    return 0;
}

#include <stdio.h>
#define BASE 10000
#define MAXG 300            /* 最多 300 组，即 1200 位 */

typedef struct {
    int g[MAXG + 1];        /* g[0] 是最低的四位 */
    int len;
} BigInt;

/* 去掉逗号，从最低位起每四位存一个元素 */
void Parse(BigInt *a, const char *s) {
    char d[MAXG * 4];
    int n = 0, i, k, v;
    for (; *s; s++)
        if (*s >= '0' && *s <= '9' && n < MAXG * 4)
            d[n++] = *s;
    a->len = 0;
    for (i = n; i > 0; i -= 4) {
        v = 0;
        for (k = (i >= 4 ? i - 4 : 0); k < i; k++)
            v = v * 10 + d[k] - '0';
        a->g[a->len++] = v;
    }
    while (a->len > 1 && a->g[a->len - 1] == 0)
        a->len--;
    if (a->len == 0)
        a->g[a->len++] = 0;
}

/* 下标相同的组对齐相加，满一万向高位进一 */
void Add(BigInt *a, BigInt *b, BigInt *c) {
    int i, carry = 0, sum, n = a->len > b->len ? a->len : b->len;
    for (i = 0; i < n; i++) {
        sum = carry;
        if (i < a->len) sum += a->g[i];
        if (i < b->len) sum += b->g[i];
        c->g[i] = sum % BASE;
        carry = sum / BASE;
    }
    c->len = n;
    if (carry)
        c->g[c->len++] = carry;
}

void Print(const char *label, BigInt *a) {
    int i;
    printf("%s = %d", label, a->g[a->len - 1]);
    for (i = a->len - 2; i >= 0; i--)
        printf(",%04d", a->g[i]);
    printf("\n");
}

int main(void) {
    char s1[1300], s2[1300];
    BigInt a, b, c;
    printf("请输入第一个整数：");
    fgets(s1, sizeof s1, stdin);
    printf("请输入第二个整数：");
    fgets(s2, sizeof s2, stdin);
    Parse(&a, s1);
    Parse(&b, s2);
    Add(&a, &b, &c);
    Print("a", &a);
    Print("b", &b);
    Print("a + b", &c);
    return 0;
}

#include <stdio.h>
#define MAXLEN 1300

typedef struct {
    char data[MAXLEN];      /* 每个元素是一位数字字符 */
    int top;
} Stack;

void Push(Stack *S, char c) { S->data[++S->top] = c; }
char Pop(Stack *S) { return S->data[S->top--]; }
int Empty(Stack *S) { return S->top == -1; }

/* 从高位到低位依次压栈，栈顶就是个位 */
void ReadNumber(Stack *S, const char *s) {
    S->top = -1;
    for (; *s; s++)
        if (*s >= '0' && *s <= '9' && S->top < MAXLEN - 2)
            Push(S, *s);
}

int main(void) {
    char s1[MAXLEN], s2[MAXLEN];
    Stack A, B, C;
    int carry = 0, sum, n;
    printf("请输入第一个整数：");
    fgets(s1, sizeof s1, stdin);
    printf("请输入第二个整数：");
    fgets(s2, sizeof s2, stdin);
    ReadNumber(&A, s1);
    ReadNumber(&B, s2);

    C.top = -1;
    while (!Empty(&A) || !Empty(&B) || carry) {    /* 两个栈顶都是当前的最低位 */
        sum = carry;
        if (!Empty(&A)) sum += Pop(&A) - '0';
        if (!Empty(&B)) sum += Pop(&B) - '0';
        Push(&C, sum % 10 + '0');                   /* 和从低位往高位压栈，栈顶是最高位 */
        carry = sum / 10;
    }
    while (C.top > 0 && C.data[C.top] == '0')      /* 去掉高位多余的 0 */
        C.top--;
    if (Empty(&C))
        Push(&C, '0');

    printf("a + b = ");
    n = C.top + 1;                                  /* 还剩几位没输出，决定在哪里加逗号 */
    while (!Empty(&C)) {
        putchar(Pop(&C));
        if (--n > 0 && n % 4 == 0)
            putchar(',');
    }
    printf("\n");
    return 0;
}

#include <stdio.h>
#include <stdlib.h>
#define BASE 10000

/* 单链表，低位组在前，每个结点四位 */
typedef struct LNode {
    int data;
    struct LNode *next;
} LNode;

typedef struct {
    LNode *low;
    int sign;
    int len;
} LongInt;

void Append(LongInt *a, LNode ***tail, int v) {
    LNode *s = (LNode *)malloc(sizeof(LNode));
    s->data = v;
    s->next = NULL;
    **tail = s;
    *tail = &s->next;
    a->len++;
}

/* 去掉高位（表尾）多余的 0 组 */
void Normalize(LongInt *a) {
    LNode *p, *last = a->low, *q;
    int k = 1, keep = 1;
    for (p = a->low; p != NULL; p = p->next, k++)
        if (p->data != 0) {
            last = p;
            keep = k;
        }
    p = last->next;
    last->next = NULL;
    for (; p != NULL; p = q) {
        q = p->next;
        free(p);
    }
    a->len = keep;
    if (a->len == 1 && a->low->data == 0)
        a->sign = 1;
}

void Parse(LongInt *a, const char *str) {
    char digits[1200];
    int len = 0, i, k, v;
    LNode **tail = &a->low;
    a->low = NULL;
    a->sign = 1;
    a->len = 0;
    for (; *str; str++) {
        if (*str == '-' && len == 0)
            a->sign = -1;
        else if (*str >= '0' && *str <= '9' && len < 1200)
            digits[len++] = *str;
    }
    for (i = len; i > 0; i -= 4) {
        v = 0;
        for (k = (i >= 4 ? i - 4 : 0); k < i; k++)
            v = v * 10 + digits[k] - '0';
        Append(a, &tail, v);
    }
    if (a->len == 0)
        Append(a, &tail, 0);
    Normalize(a);
}

/* 竖式乘法：结果先建成 la+lb 个 0 结点；a 的第 i 组乘 b 的每一组，累加到结果的第 i+j 组。
   start 指向结果的第 i 组，r 从 start 出发随 b 一起后移，单链表也能对齐 */
void Multiply(LongInt *a, LongInt *b, LongInt *c) {
    LNode *p, *q, *start, *r, **tail = &c->low;
    int k, carry, t;
    c->low = NULL;
    c->len = 0;
    for (k = 0; k < a->len + b->len; k++)
        Append(c, &tail, 0);
    for (p = a->low, start = c->low; p != NULL; p = p->next, start = start->next) {
        carry = 0;
        for (q = b->low, r = start; q != NULL; q = q->next, r = r->next) {
            t = r->data + p->data * q->data + carry;
            r->data = t % BASE;
            carry = t / BASE;
        }
        r->data += carry;           /* r 是本轮最高位的下一组，此前还是 0 */
    }
    c->sign = a->sign * b->sign;
    Normalize(c);
}

void Destroy(LongInt *a) {
    LNode *p = a->low, *q;
    for (; p != NULL; p = q) {
        q = p->next;
        free(p);
    }
}

/* 高位在表尾，递归倒着输出 */
void PrintGroups(LNode *p) {
    if (p->next == NULL) {
        printf("%d", p->data);
        return;
    }
    PrintGroups(p->next);
    printf(",%04d", p->data);
}

void Print(const char *label, LongInt *a) {
    printf("%s = %s", label, a->sign < 0 ? "-" : "");
    PrintGroups(a->low);
    printf("\n");
}

int main(void) {
    char s1[1300], s2[1300];
    LongInt a, b, c;
    printf("请输入第一个整数：");
    fgets(s1, sizeof s1, stdin);
    printf("请输入第二个整数：");
    fgets(s2, sizeof s2, stdin);
    Parse(&a, s1);
    Parse(&b, s2);
    Multiply(&a, &b, &c);
    Print("a", &a);
    Print("b", &b);
    Print("a × b", &c);
    Destroy(&a);
    Destroy(&b);
    Destroy(&c);
    return 0;
}

#include <stdio.h>
#define MAXLEN 1200

typedef struct {
    int d[2 * MAXLEN];      /* 每个元素一位，d[0] 是个位 */
    int len;
    int sign;
} BigInt;

void Parse(BigInt *a, const char *s) {
    char buf[MAXLEN];
    int n = 0, i;
    a->sign = 1;
    for (; *s; s++) {
        if (*s == '-' && n == 0)
            a->sign = -1;
        else if (*s >= '0' && *s <= '9' && n < MAXLEN)
            buf[n++] = *s;
    }
    for (i = 0; i < n; i++)
        a->d[i] = buf[n - 1 - i] - '0';
    a->len = n;
    while (a->len > 1 && a->d[a->len - 1] == 0)
        a->len--;
    if (a->len == 0)
        a->d[a->len++] = 0;
    if (a->len == 1 && a->d[0] == 0)
        a->sign = 1;
}

/* 先把 a[i]·b[j] 全部累加到 c[i+j]，不进位；最后从低位到高位统一处理一次进位 */
void Multiply(BigInt *a, BigInt *b, BigInt *c) {
    int i, j, carry = 0;
    c->len = a->len + b->len;
    for (i = 0; i < c->len; i++)
        c->d[i] = 0;
    for (i = 0; i < a->len; i++)
        for (j = 0; j < b->len; j++)
            c->d[i + j] += a->d[i] * b->d[j];
    for (i = 0; i < c->len; i++) {
        c->d[i] += carry;
        carry = c->d[i] / 10;
        c->d[i] %= 10;
    }
    while (c->len > 1 && c->d[c->len - 1] == 0)
        c->len--;
    c->sign = (c->len == 1 && c->d[0] == 0) ? 1 : a->sign * b->sign;
}

/* 从最高位输出，下标是 4 的倍数的位后面加逗号 */
void Print(const char *label, BigInt *a) {
    int i;
    printf("%s = %s", label, a->sign < 0 ? "-" : "");
    for (i = a->len - 1; i >= 0; i--) {
        printf("%d", a->d[i]);
        if (i > 0 && i % 4 == 0)
            printf(",");
    }
    printf("\n");
}

int main(void) {

    static BigInt a, b, c;

    Parse(&b, s2);
    Multiply(&a, &b, &c);
    Print("a", &a);
    Print("b", &b);
    Print("a × b", &c);

#include <stdio.h>
#define MAXLEN 1300

typedef struct {
    int d[MAXLEN];          /* 非负，d[0] 是个位 */
    int len;
} BigNum;

void Strip(BigNum *a) {
    while (a->len > 1 && a->d[a->len - 1] == 0)
        a->len--;
}

int IsZero(BigNum *a) { return a->len == 1 && a->d[0] == 0; }

/* 读入时符号单独返回，数值按位存 */
int Parse(BigNum *a, const char *s) {
    char buf[MAXLEN];
    int n = 0, i, sign = 1;
    for (; *s; s++) {
        if (*s == '-' && n == 0)
            sign = -1;
        else if (*s >= '0' && *s <= '9' && n < MAXLEN - 1)
            buf[n++] = *s;
    }
    for (i = 0; i < n; i++)
        a->d[i] = buf[n - 1 - i] - '0';
    a->len = n ? n : 1;
    if (n == 0)
        a->d[0] = 0;
    Strip(a);
    return sign;
}

int Cmp(BigNum *a, BigNum *b) {
    int i;
    if (a->len != b->len)
        return a->len - b->len;
    for (i = a->len - 1; i >= 0; i--)
        if (a->d[i] != b->d[i])
            return a->d[i] - b->d[i];
    return 0;
}

/* a -= b，要求 a >= b */
void Sub(BigNum *a, BigNum *b) {
    int i, borrow = 0;
    for (i = 0; i < a->len; i++) {
        a->d[i] -= borrow + (i < b->len ? b->d[i] : 0);
        borrow = a->d[i] < 0;
        if (borrow)
            a->d[i] += 10;
    }
    Strip(a);
}

/* r = r × 10 + digit */
void ShiftAdd(BigNum *r, int digit) {
    int i;
    if (IsZero(r)) {
        r->d[0] = digit;
        return;
    }
    for (i = r->len; i > 0; i--)
        r->d[i] = r->d[i - 1];
    r->d[0] = digit;
    r->len++;
}

/* 竖式除法：从最高位起每次落下一位，能减几次除数，这一位商就是几 */
void Divide(BigNum *a, BigNum *b, BigNum *q, BigNum *r) {
    int i, cnt;
    r->len = 1;
    r->d[0] = 0;
    q->len = a->len;
    for (i = a->len - 1; i >= 0; i--) {
        ShiftAdd(r, a->d[i]);
        for (cnt = 0; Cmp(r, b) >= 0; cnt++)
            Sub(r, b);
        q->d[i] = cnt;
    }
    Strip(q);
}

void Print(const char *label, BigNum *a, int sign) {
    int i;
    printf("%s = %s", label, sign < 0 && !IsZero(a) ? "-" : "");
    for (i = a->len - 1; i >= 0; i--) {
        printf("%d", a->d[i]);
        if (i > 0 && i % 4 == 0)
            printf(",");
    }
    printf("\n");
}

int main(void) {
    char s1[1400], s2[1400];
    static BigNum a, b, q, r;
    int sa, sb;
    printf("请输入被除数：");
    fgets(s1, sizeof s1, stdin);
    printf("请输入除数：");
    fgets(s2, sizeof s2, stdin);
    sa = Parse(&a, s1);
    sb = Parse(&b, s2);
    if (IsZero(&b)) {
        printf("除数不能为 0\n");
        return 1;
    }
    Divide(&a, &b, &q, &r);
    Print("a", &a, sa);
    Print("b", &b, sb);
    Print("商", &q, sa * sb);       /* 和 C 语言一样向 0 取整，余数与被除数同号 */
    Print("余数", &r, sa);
    return 0;
}

#include <stdio.h>
#define BASE 10000
#define MAXG 330

typedef struct {
    int g[MAXG + 2];        /* 非负，g[0] 是最低的四位 */
    int len;
} BigNum;

void Strip(BigNum *a) {
    while (a->len > 1 && a->g[a->len - 1] == 0)
        a->len--;
}

int IsZero(BigNum *a) { return a->len == 1 && a->g[0] == 0; }

int Parse(BigNum *a, const char *s) {
    char d[MAXG * 4];
    int n = 0, i, k, v, sign = 1;
    for (; *s; s++) {
        if (*s == '-' && n == 0)
            sign = -1;
        else if (*s >= '0' && *s <= '9' && n < MAXG * 4)
            d[n++] = *s;
    }
    a->len = 0;
    for (i = n; i > 0; i -= 4) {
        v = 0;
        for (k = (i >= 4 ? i - 4 : 0); k < i; k++)
            v = v * 10 + d[k] - '0';
        a->g[a->len++] = v;
    }
    if (a->len == 0)
        a->g[a->len++] = 0;
    Strip(a);
    return sign;
}

int Cmp(BigNum *a, BigNum *b) {
    int i;
    if (a->len != b->len)
        return a->len - b->len;
    for (i = a->len - 1; i >= 0; i--)
        if (a->g[i] != b->g[i])
            return a->g[i] - b->g[i];
    return 0;
}

void Sub(BigNum *a, BigNum *b) {
    int i, borrow = 0;
    for (i = 0; i < a->len; i++) {
        a->g[i] -= borrow + (i < b->len ? b->g[i] : 0);
        borrow = a->g[i] < 0;
        if (borrow)
            a->g[i] += BASE;
    }
    Strip(a);
}

/* t = b × k，k 小于 BASE */
void MulSmall(BigNum *b, int k, BigNum *t) {
    int i, carry = 0, x;
    for (i = 0; i < b->len; i++) {
        x = b->g[i] * k + carry;
        t->g[i] = x % BASE;
        carry = x / BASE;
    }
    t->len = b->len;
    if (carry)
        t->g[t->len++] = carry;
    Strip(t);
}

/* r = r × BASE + v */
void ShiftAdd(BigNum *r, int v) {
    int i;
    if (IsZero(r)) {
        r->g[0] = v;
        return;
    }
    for (i = r->len; i > 0; i--)
        r->g[i] = r->g[i - 1];
    r->g[0] = v;
    r->len++;
}

/* 万进制竖式除法：每次落下一组（四位），这一组的商在 0 ~ 9999 之间，用二分法找出最大的 q 使 b·q ≤ r */
void Divide(BigNum *a, BigNum *b, BigNum *q, BigNum *r) {
    BigNum t;
    int i, lo, hi, mid;
    r->len = 1;
    r->g[0] = 0;
    q->len = a->len;
    for (i = a->len - 1; i >= 0; i--) {
        ShiftAdd(r, a->g[i]);
        lo = 0;
        hi = BASE - 1;
        while (lo < hi) {
            mid = (lo + hi + 1) / 2;
            MulSmall(b, mid, &t);
            if (Cmp(&t, r) <= 0)
                lo = mid;
            else
                hi = mid - 1;
        }
        q->g[i] = lo;
        MulSmall(b, lo, &t);
        Sub(r, &t);
    }
    Strip(q);
}

void Print(const char *label, BigNum *a, int sign) {
    int i;
    printf("%s = %s%d", label, sign < 0 && !IsZero(a) ? "-" : "", a->g[a->len - 1]);
    for (i = a->len - 2; i >= 0; i--)
        printf(",%04d", a->g[i]);
    printf("\n");
}

int main(void) {
    char s1[1400], s2[1400];
    static BigNum a, b, q, r;
    int sa, sb;
    printf("请输入被除数：");
    fgets(s1, sizeof s1, stdin);
    printf("请输入除数：");
    fgets(s2, sizeof s2, stdin);
    sa = Parse(&a, s1);
    sb = Parse(&b, s2);
    if (IsZero(&b)) {
        printf("除数不能为 0\n");
        return 1;
    }
    Divide(&a, &b, &q, &r);
    Print("a", &a, sa);
    Print("b", &b, sb);
    Print("商", &q, sa * sb);
    Print("余数", &r, sa);
    return 0;
}

#include <stdio.h>
#define MAXSIZE 100
#define MAXRC 20

typedef struct {
    int i, j, e;
} Triple;

typedef struct {
    Triple data[MAXSIZE + 1];   /* data[1..tu]，按行序、列序递增 */
    int mu, nu, tu;
} TSMatrix;

void Input(TSMatrix *M, const char *name) {
    int t, k;
    Triple x;
    printf("请输入矩阵 %s 的行数 列数 非零元个数：", name);
    scanf("%d %d %d", &M->mu, &M->nu, &M->tu);
    printf("请输入 %d 个非零元的 行 列 值：", M->tu);
    for (t = 1; t <= M->tu; t++) {
        scanf("%d %d %d", &x.i, &x.j, &x.e);
        for (k = t - 1; k >= 1 && (M->data[k].i > x.i || (M->data[k].i == x.i && M->data[k].j > x.j)); k--)
            M->data[k + 1] = M->data[k];
        M->data[k + 1] = x;
    }
}

/* 快速转置：先数出每列的非零元个数，得到每列在转置结果中的起始位置 cpot，再一趟放到位 */
void FastTranspose(TSMatrix *M, TSMatrix *T) {
    int num[MAXRC + 1] = {0}, cpot[MAXRC + 1], col, p, q;
    T->mu = M->nu;
    T->nu = M->mu;
    T->tu = M->tu;
    for (p = 1; p <= M->tu; p++)
        num[M->data[p].j]++;
    cpot[1] = 1;
    for (col = 2; col <= M->nu; col++)
        cpot[col] = cpot[col - 1] + num[col - 1];
    for (p = 1; p <= M->tu; p++) {
        col = M->data[p].j;
        q = cpot[col]++;
        T->data[q].i = M->data[p].j;
        T->data[q].j = M->data[p].i;
        T->data[q].e = M->data[p].e;
    }
}

/* start[r]：第 r 行第一个非零元的位置，start[mu+1] = tu+1 */
void RowStart(TSMatrix *M, int start[]) {
    int r, t = 1;
    for (r = 1; r <= M->mu + 1; r++) {
        while (t <= M->tu && M->data[t].i < r)
            t++;
        start[r] = t;
    }
}

/* C[i][j] 是 A 第 i 行与 B 第 j 列的点积。B 转置后，第 j 列变成 BT 的第 j 行，
   两行都按列号有序，像归并一样找列号相同的元素相乘 */
int Multiply(TSMatrix *A, TSMatrix *B, TSMatrix *C) {
    TSMatrix BT;
    int sa[MAXRC + 2], sb[MAXRC + 2], i, j, p, q, sum;
    if (A->nu != B->mu)
        return 0;
    FastTranspose(B, &BT);
    RowStart(A, sa);
    RowStart(&BT, sb);
    C->mu = A->mu;
    C->nu = B->nu;
    C->tu = 0;
    for (i = 1; i <= A->mu; i++) {
        for (j = 1; j <= BT.mu; j++) {
            sum = 0;
            p = sa[i];
            q = sb[j];
            while (p < sa[i + 1] && q < sb[j + 1]) {
                if (A->data[p].j < BT.data[q].j)
                    p++;
                else if (A->data[p].j > BT.data[q].j)
                    q++;
                else
                    sum += A->data[p++].e * BT.data[q++].e;
            }
            if (sum != 0) {
                C->tu++;
                C->data[C->tu].i = i;
                C->data[C->tu].j = j;
                C->data[C->tu].e = sum;
            }
        }
    }
    return 1;
}

void Print(TSMatrix *M) {
    int r, c, t;
    printf("C 的三元组表：");
    for (t = 1; t <= M->tu; t++)
        printf("(%d,%d,%d) ", M->data[t].i, M->data[t].j, M->data[t].e);
    printf("\nC =\n");
    for (r = 1, t = 1; r <= M->mu; r++) {
        for (c = 1; c <= M->nu; c++) {
            if (t <= M->tu && M->data[t].i == r && M->data[t].j == c)
                printf("%5d", M->data[t++].e);
            else
                printf("%5d", 0);
        }
        printf("\n");
    }
}

int main(void) {
    TSMatrix A, B, C;
    Input(&A, "A");
    Input(&B, "B");
    if (!Multiply(&A, &B, &C)) {
        printf("A 的列数不等于 B 的行数，不能相乘\n");
        return 1;
    }
    Print(&C);
    return 0;
}

#include <stdio.h>
#define MAXSIZE 100
#define MAXRC 20

typedef struct {
    int i, j, e;
} Triple;

typedef struct {
    Triple data[MAXSIZE + 1];
    int rpos[MAXRC + 2];    /* rpos[r]：第 r 行第一个非零元的位置，rpos[mu+1] = tu+1 */
    int mu, nu, tu;
} RLSMatrix;

void SetRpos(RLSMatrix *M) {
    int num[MAXRC + 1] = {0}, r, t;
    for (t = 1; t <= M->tu; t++)
        num[M->data[t].i]++;
    M->rpos[1] = 1;
    for (r = 2; r <= M->mu + 1; r++)
        M->rpos[r] = M->rpos[r - 1] + num[r - 1];
}

void Input(RLSMatrix *M, const char *name) {
    int t, k;
    Triple x;
    printf("请输入矩阵 %s 的行数 列数 非零元个数：", name);
    scanf("%d %d %d", &M->mu, &M->nu, &M->tu);
    printf("请输入 %d 个非零元的 行 列 值：", M->tu);
    for (t = 1; t <= M->tu; t++) {
        scanf("%d %d %d", &x.i, &x.j, &x.e);
        for (k = t - 1; k >= 1 && (M->data[k].i > x.i || (M->data[k].i == x.i && M->data[k].j > x.j)); k--)
            M->data[k + 1] = M->data[k];
        M->data[k + 1] = x;
    }
    SetRpos(M);
}

/* 逐行求 C：A 第 arow 行的每个非零元 (arow, k) 与 B 第 k 行的全部非零元相乘，
   乘积按列号累加到 ctemp，这一行算完再压缩成三元组 */
int Multiply(RLSMatrix *A, RLSMatrix *B, RLSMatrix *C) {
    int arow, brow, col, p, q, ctemp[MAXRC + 1];
    if (A->nu != B->mu)
        return 0;
    C->mu = A->mu;
    C->nu = B->nu;
    C->tu = 0;
    for (arow = 1; arow <= A->mu; arow++) {
        for (col = 1; col <= C->nu; col++)
            ctemp[col] = 0;
        for (p = A->rpos[arow]; p < A->rpos[arow + 1]; p++) {
            brow = A->data[p].j;
            for (q = B->rpos[brow]; q < B->rpos[brow + 1]; q++)
                ctemp[B->data[q].j] += A->data[p].e * B->data[q].e;
        }
        for (col = 1; col <= C->nu; col++) {
            if (ctemp[col] != 0) {
                C->tu++;
                C->data[C->tu].i = arow;
                C->data[C->tu].j = col;
                C->data[C->tu].e = ctemp[col];
            }
        }
    }
    SetRpos(C);
    return 1;
}

void Print(RLSMatrix *M) {
    int r, c, t;
    printf("C 的三元组表：");
    for (t = 1; t <= M->tu; t++)
        printf("(%d,%d,%d) ", M->data[t].i, M->data[t].j, M->data[t].e);
    printf("\nC =\n");
    for (r = 1, t = 1; r <= M->mu; r++) {
        for (c = 1; c <= M->nu; c++) {
            if (t <= M->tu && M->data[t].i == r && M->data[t].j == c)
                printf("%5d", M->data[t++].e);
            else
                printf("%5d", 0);
        }
        printf("\n");
    }
}

int main(void) {
    RLSMatrix A, B, C;
    Input(&A, "A");
    Input(&B, "B");
    if (!Multiply(&A, &B, &C)) {
        printf("A 的列数不等于 B 的行数，不能相乘\n");
        return 1;
    }
    Print(&C);
    return 0;
}

#include <stdio.h>
#include <string.h>
#include <ctype.h>
#define MAXSIZE 100

int Prior(char op) {
    if (op == '+' || op == '-') return 1;
    if (op == '*' || op == '/') return 2;
    return 0;               /* '(' */
}

/* 变量直接输出；运算符入栈前，先弹出栈顶优先级不低于它的运算符；
   左括号入栈，右括号弹出到左括号为止 */
void ToRPN(const char *s, char *out) {
    char stack[MAXSIZE];
    int top = -1, k = 0;
    for (; *s != '\0'; s++) {
        char c = *s;
        if (isalpha((unsigned char)c)) {
            out[k++] = c;
        } else if (c == '(') {
            stack[++top] = c;
        } else if (c == ')') {
            while (stack[top] != '(')
                out[k++] = stack[top--];
            top--;
        } else if (strchr("+-*/", c)) {
            while (top >= 0 && Prior(stack[top]) >= Prior(c))
                out[k++] = stack[top--];
            stack[++top] = c;
        }                   /* 空格等其他字符忽略 */
    }
    while (top >= 0)
        out[k++] = stack[top--];
    out[k] = '\0';
}

int main(void) {
    char line[MAXSIZE], out[MAXSIZE];
    printf("请输入表达式（每行一个，空行结束）：");
    while (fgets(line, sizeof line, stdin) != NULL && line[0] != '\n') {
        line[strcspn(line, "\r\n")] = '\0';
        ToRPN(line, out);
        printf("%s  →  %s\n", line, out);
    }
    return 0;
}

#include <stdio.h>
#include <string.h>
#define MAXSIZE 100

const char *p;              /* 当前读到的位置 */
char out[MAXSIZE];
int k;

void Expr(void);

/* 因子 = 变量 | ( 表达式 ) */
void Factor(void) {
    if (*p == '(') {
        p++;
        Expr();
        p++;                /* 跳过 ')' */
    } else {
        out[k++] = *p++;
    }
}

/* 项 = 因子 { (*|/) 因子 }：两个因子都输出后再输出运算符 */
void Term(void) {
    char op;
    Factor();
    while (*p == '*' || *p == '/') {
        op = *p++;
        Factor();
        out[k++] = op;
    }
}

/* 表达式 = 项 { (+|-) 项 } */
void Expr(void) {
    char op;
    Term();
    while (*p == '+' || *p == '-') {
        op = *p++;
        Term();
        out[k++] = op;
    }
}

int main(void) {
    char line[MAXSIZE], expr[MAXSIZE];
    int i, n;
    printf("请输入表达式（每行一个，空行结束）：");
    while (fgets(line, sizeof line, stdin) != NULL && line[0] != '\n') {
        line[strcspn(line, "\r\n")] = '\0';
        for (i = n = 0; line[i] != '\0'; i++)   /* 去掉空格 */
            if (line[i] != ' ')
                expr[n++] = line[i];
        expr[n] = '\0';
        p = expr;
        k = 0;
        Expr();
        out[k] = '\0';
        printf("%s  →  %s\n", line, out);
    }
    return 0;
}

#include <stdio.h>
#include <string.h>
#include <ctype.h>
#define MAXLEN 1000

typedef struct {
    char ch[MAXLEN + 1];
    int length;
} SqString;

void Statistics(SqString *S) {
    int i, letters = 0, digits = 0, spaces = 0, others = 0;
    for (i = 0; i < S->length; i++) {
        unsigned char c = S->ch[i];
        if (isalpha(c)) letters++;
        else if (isdigit(c)) digits++;
        else if (c == ' ') spaces++;
        else others++;
    }
    printf("英文字母 %d 个，数字 %d 个，空格 %d 个，其他字符 %d 个\n", letters, digits, spaces, others);
}

/* 从位置 i 开始是否与 t 相同 */
int MatchAt(SqString *S, int i, const char *t, int m) {
    int k;
    for (k = 0; k < m; k++)
        if (S->ch[i + k] != t[k])
            return 0;
    return 1;
}

/* 统计出现次数：匹配成功后跳过整个子串，不重叠计数 */
int Count(SqString *S, const char *t) {
    int i = 0, m = (int)strlen(t), cnt = 0;
    while (i + m <= S->length) {
        if (MatchAt(S, i, t, m)) {
            cnt++;
            i += m;
        } else {
            i++;
        }
    }
    return cnt;
}

/* 删除：每找到一处，就把它后面的字符整体前移 m 位 */
void Delete(SqString *S, const char *t) {
    int i = 0, k, m = (int)strlen(t);
    while (i + m <= S->length) {
        if (MatchAt(S, i, t, m)) {
            for (k = i; k + m < S->length; k++)
                S->ch[k] = S->ch[k + m];
            S->length -= m;
        } else {
            i++;
        }
    }
    S->ch[S->length] = '\0';
}

int main(void) {
    SqString S;
    char t[MAXLEN + 1];
    printf("请输入一行文本：");
    fgets(S.ch, sizeof S.ch, stdin);
    S.ch[strcspn(S.ch, "\r\n")] = '\0';
    S.length = (int)strlen(S.ch);
    printf("请输入要统计和删除的字符串：");
    fgets(t, sizeof t, stdin);
    t[strcspn(t, "\r\n")] = '\0';
    if (t[0] == '\0') {
        printf("要查找的字符串不能为空\n");
        return 1;
    }
    Statistics(&S);
    printf("\"%s\" 出现了 %d 次\n", t, Count(&S, t));
    Delete(&S, t);
    printf("删除后：%s\n", S.ch);
    return 0;
}

#include <stdio.h>

#define MAXLEN 1000

/* 用 ASCII 范围直接判断字符类别 */
void Statistics(const char *s) {
    int letters = 0, digits = 0, spaces = 0, others = 0;
    for (; *s; s++) {
        if ((*s >= 'a' && *s <= 'z') || (*s >= 'A' && *s <= 'Z')) letters++;
        else if (*s >= '0' && *s <= '9') digits++;
        else if (*s == ' ') spaces++;
        else others++;
    }
    printf("英文字母 %d 个，数字 %d 个，空格 %d 个，其他字符 %d 个\n", letters, digits, spaces, others);
}

/* 双指针一趟完成计数和删除：i 读、w 写。i 处匹配就跳过整个子串并计数，否则把字符搬到 w。
   每个字符最多搬一次，不会像逐次前移那样反复移动后面的内容 */
int CountAndDelete(char *s, const char *t) {
    int i = 0, w = 0, m = (int)strlen(t), n = (int)strlen(s), cnt = 0;
    while (i < n) {
        if (i + m <= n && strncmp(s + i, t, m) == 0) {
            cnt++;
            i += m;
        } else {
            s[w++] = s[i++];
        }
    }
    s[w] = '\0';
    return cnt;
}

int main(void) {
    char s[MAXLEN + 1], t[MAXLEN + 1];
    int cnt;
    printf("请输入一行文本：");
    fgets(s, sizeof s, stdin);
    s[strcspn(s, "\r\n")] = '\0';
    printf("请输入要统计和删除的字符串：");
    fgets(t, sizeof t, stdin);
    t[strcspn(t, "\r\n")] = '\0';
    if (t[0] == '\0') {
        printf("要查找的字符串不能为空\n");
        return 1;
    }
    Statistics(s);
    cnt = CountAndDelete(s, t);
    printf("\"%s\" 出现了 %d 次\n", t, cnt);
    printf("删除后：%s\n", s);
    return 0;
}

#include <stdio.h>
#include <stdlib.h>
#define DAYS 10

typedef struct Node {
    int day, peach;         /* 第几天，这天开始时有几个桃子 */
    struct Node *next;
} Node;

/* 前一天的桃子数 = (后一天的桃子数 + 1) × 2 */

/* 1）链表：从第 10 天往前推，每推出一天就在表头插入结点，最后表头是第 1 天 */
Node *ByList(void) {
    Node *head = NULL, *s;
    int d, x = 1;
    for (d = DAYS; d >= 1; d--) {
        s = (Node *)malloc(sizeof(Node));
        s->day = d;
        s->peach = x;
        s->next = head;
        head = s;
        x = (x + 1) * 2;
    }
    return head;
}

/* 2）栈：第 10 天的 1 个先入栈，每次由栈顶推出前一天并入栈，最后栈顶就是第 1 天 */
int ByStack(void) {
    int stack[DAYS], top = -1, d;
    stack[++top] = 1;
    for (d = DAYS - 1; d >= 1; d--) {
        stack[top + 1] = (stack[top] + 1) * 2;
        top++;
    }
    return stack[top];
}

/* 3）递归：Peach(d) = (Peach(d + 1) + 1) × 2，第 10 天是出口 */
int ByRecursion(int d) {
    if (d == DAYS)
        return 1;
    return (ByRecursion(d + 1) + 1) * 2;
}

int main(void) {
    Node *head = ByList(), *p;
    printf("链表法：第 1 天共有 %d 个桃子\n", head->peach);
    printf("栈　法：第 1 天共有 %d 个桃子\n", ByStack());
    printf("递归法：第 1 天共有 %d 个桃子\n", ByRecursion(1));
    printf("每天开始时的桃子数：");
    for (p = head; p != NULL; p = p->next)
        printf("%d ", p->peach);
    printf("\n");
    while (head != NULL) {
        p = head;
        head = head->next;
        free(p);
    }
    return 0;
}

int main(void) {

    /* 倒推：从第 10 天的 1 个往前推 9 天 */
    for (d = DAYS - 1; d >= 1; d--)
        x = (x + 1) * 2;

    /* 通项：x(d) + 2 = 2 × (x(d+1) + 2)，所以 x(1) + 2 = 2^9 × (1 + 2) */
    formula = 3 * (1 << (DAYS - 1)) - 2;

    printf("倒推：第 1 天共有 %d 个桃子\n", x);
    printf("公式：3 × 2^%d - 2 = %d\n", DAYS - 1, formula);

    printf("正向验证：\n");
    left = x;
    for (d = 1; d < DAYS; d++) {
        eat = left / 2 + 1;
        printf("  第 %2d 天有 %4d 个，吃掉 %4d 个\n", d, left, eat);
        left -= eat;
    }
    printf("  第 %2d 天剩 %d 个\n", DAYS, left);

#include <stdio.h>
#define MAXP 50
#define MAXF 9
#define QSIZE (MAXP + 1)

enum { IDLE, UP, DOWN };

typedef struct {
    int id, t, from, to;    /* 编号、到达时刻、出发楼层、目标楼层 */
    int boardT, leaveT;     /* 进电梯、出电梯的时刻 */
} Passenger;

typedef struct {
    int data[QSIZE];        /* 存乘客下标 */
    int front, rear;
} SqQueue;

Passenger P[MAXP];
int np, floors;
SqQueue upQ[MAXF + 1], downQ[MAXF + 1];     /* 每层的上行、下行等候队列 */
int inCar[MAXP], nCar = 0;                  /* 电梯里的乘客 */
int cur = 1, dir = IDLE, delivered = 0;

int QEmpty(SqQueue *q) { return q->front == q->rear; }
void EnQueue(SqQueue *q, int x) { q->data[q->rear] = x; q->rear = (q->rear + 1) % QSIZE; }
int DeQueue(SqQueue *q) { int x = q->data[q->front]; q->front = (q->front + 1) % QSIZE; return x; }

/* 当前楼层之上（above 为 1）或之下是否还有要去的地方：电梯里乘客的目的地，或有人等候的楼层 */
int HasRequest(int above) {
    int k, f;
    for (k = 0; k < nCar; k++)
        if (above ? P[inCar[k]].to > cur : P[inCar[k]].to < cur)
            return 1;
    for (f = 1; f <= floors; f++)
        if ((above ? f > cur : f < cur) && (!QEmpty(&upQ[f]) || !QEmpty(&downQ[f])))
            return 1;
    return 0;
}

void Arrive(int k, int t) {
    if (P[k].to > P[k].from)
        EnQueue(&upQ[P[k].from], k);
    else
        EnQueue(&downQ[P[k].from], k);
    printf("t=%3d  乘客 %d 在 %d 楼等候，要去 %d 楼\n", t, P[k].id, P[k].from, P[k].to);
}

/* 到达目的楼层的乘客走出电梯 */
int Unload(int t) {
    int k = 0, act = 0, x;
    while (k < nCar) {
        x = inCar[k];
        if (P[x].to == cur) {
            P[x].leaveT = t;
            printf("t=%3d  %d 楼：乘客 %d 走出电梯\n", t, cur, P[x].id);
            inCar[k] = inCar[--nCar];
            delivered++;
            act = 1;
        } else {
            k++;
        }
    }
    return act;
}

/* 本层与运行方向相同的等候者依次进入电梯 */
int Board(int t) {
    SqQueue *q = dir == UP ? &upQ[cur] : dir == DOWN ? &downQ[cur] : NULL;
    int act = 0, x;
    while (q != NULL && !QEmpty(q)) {
        x = DeQueue(q);
        P[x].boardT = t;
        inCar[nCar++] = x;
        printf("t=%3d  %d 楼：乘客 %d 进入电梯（去 %d 楼）\n", t, cur, P[x].id, P[x].to);
        act = 1;
    }
    return act;
}

/* 电梯在时刻 t 的一个动作：开门上下客，或者移动一层；什么也没做返回 0 */
int ElevatorStep(int t) {
    int act = Unload(t);
    if (dir == IDLE) {          /* 空闲：本层有人就按他的方向走，否则去有请求的一边 */
        if (!QEmpty(&upQ[cur])) dir = UP;
        else if (!QEmpty(&downQ[cur])) dir = DOWN;
        else if (HasRequest(1)) dir = UP;
        else if (HasRequest(0)) dir = DOWN;
    }
    act |= Board(t);
    if (!act && dir == UP && !HasRequest(1)) {          /* 上面没有请求了，掉头或停下 */
        dir = (HasRequest(0) || !QEmpty(&downQ[cur])) ? DOWN : IDLE;
        act |= Board(t);
    } else if (!act && dir == DOWN && !HasRequest(0)) {
        dir = (HasRequest(1) || !QEmpty(&upQ[cur])) ? UP : IDLE;
        act |= Board(t);
    }
    if (!act && dir != IDLE) {  /* 没有人上下，沿运行方向移动一层 */
        cur += dir == UP ? 1 : -1;
        act = 1;
    }
    return act;
}

int main(void) {
    int i, j, t, ticks = 0, next = 0;
    double wait = 0, ride = 0;
    Passenger x;
    printf("请输入楼层数（2~%d）：", MAXF);
    scanf("%d", &floors);
    printf("请输入乘客人数：");
    scanf("%d", &np);
    if (floors < 2 || floors > MAXF || np < 1 || np > MAXP) {
        printf("楼层数或人数超出范围\n");
        return 1;
    }
    for (i = 0; i < np; i++) {
        printf("请输入第 %d 位乘客的到达时刻 出发楼层 目标楼层：", i + 1);
        scanf("%d %d %d", &P[i].t, &P[i].from, &P[i].to);
        P[i].id = i + 1;
        if (P[i].t < 0 || P[i].from < 1 || P[i].from > floors || P[i].to < 1 ||
            P[i].to > floors || P[i].from == P[i].to) {
            printf("第 %d 位乘客的数据不合法\n", i + 1);
            return 1;
        }
    }
    for (i = 1; i < np; i++) {          /* 按到达时刻排序（稳定） */
        x = P[i];
        for (j = i - 1; j >= 0 && P[j].t > x.t; j--)
            P[j + 1] = P[j];
        P[j + 1] = x;
    }
    for (i = 1; i <= floors; i++)
        upQ[i].front = upQ[i].rear = downQ[i].front = downQ[i].rear = 0;

    /* 固定步长：时钟每次推进 1 个单位，每个时刻都检查一遍 */
    for (t = 0; delivered < np; t++) {
        while (next < np && P[next].t == t)
            Arrive(next++, t);
        ElevatorStep(t);
        ticks++;
    }

    for (i = 0; i < np; i++) {
        wait += P[i].boardT - P[i].t;
        ride += P[i].leaveT - P[i].boardT;
    }
    printf("全部送达。平均等候 %.1f，平均乘梯 %.1f\n", wait / np, ride / np);
    printf("时钟共推进 %d 次\n", ticks);
    return 0;
}

#include <stdio.h>

#define MAXP 50

enum { IDLE, UP, DOWN };

    int boardT, leaveT;
} Passenger;

typedef struct QNode {
    int who;
    struct QNode *next;
} QNode;

typedef struct {
    QNode *front, *rear;    /* 带头结点的链队列 */
} LinkQueue;

typedef struct Event {
    int time, type, who;
    struct Event *next;
} Event;

Passenger P[MAXP];
int np, floors;
LinkQueue upQ[MAXF + 1], downQ[MAXF + 1];
int inCar[MAXP], nCar = 0;
int cur = 1, dir = IDLE;
Event *events = NULL;       /* 事件表，按时刻有序 */

void InitQueue(LinkQueue *q) {
    q->front = q->rear = (QNode *)malloc(sizeof(QNode));
    q->front->next = NULL;
}

int QEmpty(LinkQueue *q) { return q->front == q->rear; }

void EnQueue(LinkQueue *q, int x) {
    QNode *s = (QNode *)malloc(sizeof(QNode));
    s->who = x;
    s->next = NULL;
    q->rear->next = s;
    q->rear = s;
}

int DeQueue(LinkQueue *q) {
    QNode *p = q->front->next;
    int x = p->who;
    q->front->next = p->next;
    if (q->rear == p)
        q->rear = q->front;
    free(p);
    return x;
}

/* 按（时刻，类型，乘客）有序插入事件表；同一时刻乘客到达排在电梯动作之前 */
void Schedule(int time, int type, int who) {
    Event **pp = &events, *e = (Event *)malloc(sizeof(Event));
    e->time = time;
    e->type = type;
    e->who = who;
    while (*pp != NULL && ((*pp)->time < time ||
           ((*pp)->time == time && ((*pp)->type < type || ((*pp)->type == type && (*pp)->who <= who)))))
        pp = &(*pp)->next;
    e->next = *pp;
    *pp = e;
}

int HasRequest(int above) {
    int k, f;
    for (k = 0; k < nCar; k++)

            printf("t=%3d  %d 楼：乘客 %d 走出电梯\n", t, cur, P[x].id);
            inCar[k] = inCar[--nCar];
            act = 1;
        } else {
            k++;
        }
    }

}

int Board(int t) {
    LinkQueue *q = dir == UP ? &upQ[cur] : dir == DOWN ? &downQ[cur] : NULL;
    int act = 0, x;
    while (q != NULL && !QEmpty(q)) {
        x = DeQueue(q);
        P[x].boardT = t;
        inCar[nCar++] = x;
        printf("t=%3d  %d 楼：乘客 %d 进入电梯（去 %d 楼）\n", t, cur, P[x].id, P[x].to);
        act = 1;
    }
    return act;
}

/* 电梯的调度规则与解法一相同 */
int ElevatorStep(int t) {
    int act = Unload(t);
    if (dir == IDLE) {
        if (!QEmpty(&upQ[cur])) dir = UP;
        else if (!QEmpty(&downQ[cur])) dir = DOWN;

        Schedule(P[i].t, ARRIVE, i);
    }

    /* 下一事件推进：时钟直接跳到事件表中最早的事件。电梯有事可做时，
       每个动作结束后预约下一时刻的动作；空闲时不预约，等有人到达再唤醒 */
    while (events != NULL) {
        e = events;
        events = e->next;
        now = e->time;
        count++;
        if (e->type == ARRIVE) {
            Arrive(e->who, now);
            if (!stepPending) {
                Schedule(now, STEP, 0);
                stepPending = 1;
            }
        } else {
            stepPending = 0;
            if (ElevatorStep(now)) {
                Schedule(now + 1, STEP, 0);
                stepPending = 1;
            }
        }
        free(e);
    }

    for (i = 0; i < np; i++) {
        wait += P[i].boardT - P[i].t;
        ride += P[i].leaveT - P[i].boardT;
    }
    printf("全部送达。平均等候 %.1f，平均乘梯 %.1f\n", wait / np, ride / np);
    printf("共处理 %d 个事件\n", count);
    return 0;
}
</script>
